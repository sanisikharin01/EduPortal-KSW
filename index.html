    // Helper: Embed URL Parser for Video Streaming
    const getEmbedUrl = (url) => {
      if (!url) return null;
      // YouTube
      const ytMatch = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
      if (ytMatch && ytMatch[1]) return `https://www.youtube.com/embed/${ytMatch[1]}`;
      // Google Drive Preview
      const driveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      return null;
    };

    // Helper: Convert File to Base64
    const fileToBase64 = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({
          base64: reader.result,
          name: file.name,
          mimeType: file.type || 'application/octet-stream',
          size: file.size
        });
        reader.onerror = error => reject(error);
      });
    };

          if (!allowedStr || allowedStr === '*' || allowedStr.trim() === '') return db.Courses || [];
          const allowedList = allowedStr.split(',').map(s => s.trim().toUpperCase());
          return (db.Courses || []).filter(c => allowedList.includes(String(c.CourseID).toUpperCase()) || allowedList.includes(String(c.Code).toUpperCase()));
        }
        return [];
      }, [db.Courses, currentUser]);

      const selectedCourse = useMemo(() => {
        if (!selectedCourseId) return null;
        return (db.Courses || []).find(c => c.CourseID === selectedCourseId) || null;
      }, [db.Courses, selectedCourseId]);

      // Check if user is logged in
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-950 flex flex-col items-center justify-center p-4">
            <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
              <div className="text-center mb-8">
                <div className="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-brand-500 rounded-2xl flex items-center justify-center text-white mx-auto shadow-lg shadow-indigo-500/30 mb-4">
                  <Icon name="GraduationCap" size={36} />
                </div>
                <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">EduPortal LMS</h1>
                <p className="text-slate-500 text-sm mt-1">ระบบจัดการเรียนการสอนออนไลน์สำหรับโรงเรียน</p>
                <div className="inline-block mt-2 px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full">
                  100% Free Serverless • Google Apps Script + Sheets
                </div>
              </div>

              <LoginForm db={db} onLogin={(role, user) => setCurrentUser({ role, user })} />
            </div>
            <p className="text-slate-400 text-xs mt-6 text-center">
              EduPortal Online School Management • Powered by SANISIKHARIN ADMIN@KASEM & Gemini 4 Argon
            </p>
          </div>
        );
      }

      // Handle Exam Taking View
      if (takingExam) {
        return (
          <ExamTakingView
            exam={takingExam}
            student={currentUser.user}
            onComplete={async (attemptData) => {
              await saveRecordToSheet('ExamAttempts', attemptData);
              if (gasUrl) {
                await callGasApi('recordExamAttempt', { attempt: attemptData });
              }
              setTakingExam(null);
              Swal.fire({
                icon: 'success',
                title: 'ส่งกระดาษคำตอบเรียบร้อย!',
                html: `คุณได้คะแนน <b>${attemptData.Score}</b> จาก ${attemptData.TotalScore} คะแนน`,
                confirmButtonColor: '#4f46e5'
              });
            }}
            onCancel={() => setTakingExam(null)}
          />
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col font-sans">
          {/* Top Admin Control Bar - Strictly Visible Only to Admins */}
          {currentUser.role === 'admin' && (
            <AdminControlBar 
              gasUrl={gasUrl} 
              setGasUrl={setGasUrl} 
              isSyncing={isSyncing} 
              onPing={handlePingGAS} 
              onSetup={handleSetupDatabase} 
              onPull={handlePullData} 
              onPush={handlePushData} 
            />
          )}

          {/* Main Top Navigation Header */}
          <Navbar 
            currentUser={currentUser} 
            currentTab={currentTab} 
            isSyncing={isSyncing}
            onRefresh={handlePullData}
            onOpenProfile={() => setShowMobileProfile(true)}
            setCurrentTab={(tab) => { setSelectedCourseId(null); setCurrentTab(tab); }} 
            onLogout={() => {
              Swal.fire({
                title: 'ต้องการออกจากระบบ?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ออกจากระบบ',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#ef4444'
              }).then((result) => {
                if (result.isConfirmed) {
                  setCurrentUser(null);
                  setShowMobileProfile(false);
                  sessionStorage.removeItem('eduportal_seen_announcement');
                }
              });
            }}
          />

          {/* Announcement Popup Modal (If Active and Not Dismissed) */}
          {showAnnouncement && currentAnnouncement && (
            <AnnouncementModal announcement={currentAnnouncement} onClose={() => setShowAnnouncement(false)} />
          )}

          {/* Mobile Profile & Quick Actions Sheet */}
          {showMobileProfile && (
            <MobileProfileModal
              currentUser={currentUser}
              onClose={() => setShowMobileProfile(false)}
              onShowAnnouncement={() => { setShowMobileProfile(false); setShowAnnouncement(true); }}
              onRefresh={() => { setShowMobileProfile(false); handlePullData(); }}
              onLogout={() => {
                setShowMobileProfile(false);
                Swal.fire({
                  title: 'ต้องการออกจากระบบ?',
                  icon: 'question',
                  showCancelButton: true,
                  confirmButtonText: 'ออกจากระบบ',
                  cancelButtonText: 'ยกเลิก',
                  confirmButtonColor: '#ef4444'
                }).then((result) => {
                  if (result.isConfirmed) {
                    setCurrentUser(null);
                    sessionStorage.removeItem('eduportal_seen_announcement');
                  }
                });
              }}
            />
          )}

          {/* Main Content Workspace (pb-24 on mobile for fixed bottom nav) */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-3.5 sm:px-6 lg:px-8 py-4 sm:py-6 pb-24 md:pb-8">
            {selectedCourse ? (
              <CourseDetailView
                course={selectedCourse}
                db={db}
                currentUser={currentUser}
                gasUrl={gasUrl}
                callGasApi={callGasApi}
                courseTab={courseTab}
                setCourseTab={setCourseTab}
                onBack={() => setSelectedCourseId(null)}
                onSaveRecord={saveRecordToSheet}
                onDeleteRecord={deleteRecordFromSheet}
                onStartExam={(exam) => setTakingExam(exam)}
              />
            ) : (
              <div>
                {currentTab === 'courses' && (
                  <CoursesView
                    courses={visibleCourses}
                    teachers={db.Teachers || []}
                    currentUser={currentUser}
                    onSelectCourse={(c) => { setCourseTab('lessons'); setSelectedCourseId(c.CourseID); }}
                    onSaveCourse={(c) => saveRecordToSheet('Courses', c)}
                    onDeleteCourse={(id) => deleteRecordFromSheet('Courses', id)}
                  />
                )}

                {currentTab === 'students' && currentUser.role === 'admin' && (
                  <StudentsManagementView
                    students={db.Students || []}
                    courses={db.Courses || []}
                    gasUrl={gasUrl}
                    callGasApi={callGasApi}
                    onSaveStudent={(st) => saveRecordToSheet('Students', st)}
                    onDeleteStudent={(id) => deleteRecordFromSheet('Students', id)}
                    onBatchImportSuccess={(newStudents) => {
                      setDb(prev => {
                        const existing = prev.Students || [];
                        const map = new Map(existing.map(s => [s.StudentID, s]));
                        newStudents.forEach(ns => map.set(ns.StudentID, ns));
                        return { ...prev, Students: Array.from(map.values()) };
                      });
                    }}
                  />
                )}

                {currentTab === 'teachers' && currentUser.role === 'admin' && (
                  <TeachersManagementView 
                    teachers={db.Teachers || []}
                    onSaveTeacher={(t) => saveRecordToSheet('Teachers', t)}
                    onDeleteTeacher={(id) => deleteRecordFromSheet('Teachers', id)}
                  />
                )}

                {currentTab === 'announcements' && (
                  <AnnouncementsView
                    settings={db.Settings || []}
                    currentUser={currentUser}
                    onSaveAnnouncement={(updatedAnn) => {
                      const record = {
                        SettingKey: 'Announcement',
                        SettingValueJSON: JSON.stringify(updatedAnn),
                        UpdatedAt: new Date().toISOString()
                      };
                      saveRecordToSheet('Settings', record);
                      Swal.fire({ icon: 'success', title: 'บันทึกประกาศสำเร็จ', timer: 1500, showConfirmButton: false });
                    }}
                  />
                )}

                {currentTab === 'ai_settings' && (currentUser.role === 'teacher' || currentUser.role === 'admin') && (
                  <AiSettingsView
                    currentUser={currentUser}
                    settings={db.Settings || []}
                    onSaveSetting={(st) => saveRecordToSheet('Settings', st)}
                  />
                )}

                {currentTab === 'settings' && currentUser.role === 'admin' && (
                  <SettingsView 
                    settings={db.Settings || []} 
                    gasUrl={gasUrl}
                    setGasUrl={setGasUrl}
                    onPing={handlePingGAS}
                    onSetup={handleSetupDatabase}
                    onPull={handlePullData}
                    onPush={handlePushData}
                    onSaveSetting={(st) => saveRecordToSheet('Settings', st)} 
                  />
                )}
              </div>
            )}
          </main>

          {/* Mobile Fixed Bottom Navigation Bar */}
          <MobileBottomNav
            currentUser={currentUser}
            currentTab={currentTab}
            setCurrentTab={(tab) => { setSelectedCourseId(null); setCurrentTab(tab); }}
            selectedCourse={selectedCourse}
            onBackFromCourse={() => setSelectedCourseId(null)}
            courseTab={courseTab}
            setCourseTab={setCourseTab}
            db={db}
            onOpenProfile={() => setShowMobileProfile(true)}
          />
        </div>
      );
    }

    // --- Navigation Header Component ---
    function Navbar({ currentUser, currentTab, isSyncing, onRefresh, onOpenProfile, setCurrentTab, onLogout }) {
      const getRoleBadge = (role) => {
        if (role === 'admin') return <span className="bg-rose-100 text-rose-700 font-semibold px-2.5 py-0.5 rounded-full text-[11px]">ผู้ดูแลระบบ</span>;
        if (role === 'teacher') return <span className="bg-amber-100 text-amber-700 font-semibold px-2.5 py-0.5 rounded-full text-[11px]">ครูผู้สอน</span>;
        return <span className="bg-emerald-100 text-emerald-700 font-semibold px-2.5 py-0.5 rounded-full text-[11px]">นักเรียน</span>;
      };

      const displayName = currentUser.role === 'admin' ? 'ผู้ดูแลระบบ' : (currentUser.user?.Name || 'ผู้ใช้งาน');

      return (
        <header className="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-sm">
          <div className="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-14 sm:h-16">
              <div className="flex items-center gap-4 lg:gap-6">
                <div 
                  className="flex items-center gap-2.5 sm:gap-3 cursor-pointer group"
                  onClick={() => setCurrentTab('courses')}
                >
                  <div className="w-9 h-9 sm:w-10 sm:h-10 bg-gradient-to-tr from-indigo-600 to-brand-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-600/20 group-hover:scale-105 transition">
                    <Icon name="GraduationCap" size={20} />
                  </div>
                  <div>
                    <span className="font-extrabold text-base sm:text-lg text-slate-900 tracking-tight block leading-tight">EduPortal</span>
                    <span className="text-[10px] sm:text-[11px] text-slate-400 font-semibold tracking-wide uppercase block">School LMS</span>
                  </div>
                </div>

                {/* Desktop Top Navigation */}
                <nav className="hidden md:flex items-center gap-1 pl-4 border-l border-slate-200">
                  <TabButton active={currentTab === 'courses'} onClick={() => setCurrentTab('courses')} icon="BookOpen" label="รายวิชาเรียน" />
                  
                  {currentUser.role === 'admin' && (
                    <>
                      <TabButton active={currentTab === 'students'} onClick={() => setCurrentTab('students')} icon="Users" label="ข้อมูลนักเรียน" />
                      <TabButton active={currentTab === 'teachers'} onClick={() => setCurrentTab('teachers')} icon="UserCheck" label="ข้อมูลครู" />
                      <TabButton active={currentTab === 'announcements'} onClick={() => setCurrentTab('announcements')} icon="Bell" label="ประกาศโรงเรียน" />
                      <TabButton active={currentTab === 'ai_settings'} onClick={() => setCurrentTab('ai_settings')} icon="Sparkles" label="ตั้งค่า AI" />
                      <TabButton active={currentTab === 'settings'} onClick={() => setCurrentTab('settings')} icon="Settings" label="ตั้งค่าระบบ" />
                    </>
                  )}

                  {currentUser.role === 'teacher' && (
                    <>
                      <TabButton active={currentTab === 'announcements'} onClick={() => setCurrentTab('announcements')} icon="Bell" label="ประกาศโรงเรียน" />
                      <TabButton active={currentTab === 'ai_settings'} onClick={() => setCurrentTab('ai_settings')} icon="Sparkles" label="ตั้งค่าโมเดล AI" />
                    </>
                  )}

                  {currentUser.role === 'student' && (
                    <TabButton active={currentTab === 'announcements'} onClick={() => setCurrentTab('announcements')} icon="Bell" label="ประกาศโรงเรียน" />
                  )}
                </nav>
              </div>

              {/* Right Side User Info & Quick Actions */}
              <div className="flex items-center gap-2 sm:gap-3">
                {/* Quick Sync Button on Mobile & Desktop */}
                <button
                  onClick={onRefresh}
                  disabled={isSyncing}
                  title="ซิงค์ข้อมูลล่าสุด"
                  className="p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition border border-slate-200/80 sm:border-transparent active:scale-95"
                >
                  <Icon name="RefreshCw" size={18} className={isSyncing ? "animate-spin text-indigo-600" : ""} />
                </button>

                {/* Mobile User Profile Pill (Tappable to open profile sheet) */}
                <button
                  onClick={onOpenProfile}
                  className="flex sm:hidden items-center gap-2 pl-2.5 pr-2 py-1 bg-slate-100 hover:bg-slate-200/70 rounded-full border border-slate-200/80 active:scale-95 transition"
                >
                  <div className="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center">
                    {displayName.charAt(0)}
                  </div>
                  <span className="text-xs font-bold text-slate-800 max-w-[95px] truncate">{displayName}</span>
                </button>

                {/* Desktop User Profile Info */}
                <div className="text-right hidden sm:block">
                  <div className="text-sm font-bold text-slate-800 leading-tight">
                    {currentUser.role === 'admin' ? 'ผู้ดูแลระบบ (Administrator)' : currentUser.user?.Name}
                  </div>
                  <div className="flex items-center justify-end gap-1.5 mt-0.5">
                    {getRoleBadge(currentUser.role)}
                    {currentUser.role === 'student' && (
                      <span className="text-xs text-slate-400 font-mono">#{currentUser.user?.StudentID}</span>
                    )}
                  </div>
                </div>

                <button
                  onClick={onLogout}
                  title="ออกจากระบบ"
                  className="hidden sm:flex p-2.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition border border-transparent hover:border-rose-100"
                >
                  <Icon name="LogOut" size={20} />
                </button>
              </div>
            </div>
          </div>
        </header>
      );
    }

    function TabButton({ active, onClick, icon, label }) {
      return (
        <button
          onClick={onClick}
          className={`flex items-center gap-2 px-3.5 py-2 rounded-xl font-bold text-xs sm:text-sm transition whitespace-nowrap ${
            active ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
          }`}
        >
          <Icon name={icon} size={16} />
          <span>{label}</span>
        </button>
      );
    }

    // --- Mobile Bottom Navigation Bar (Fixed App-like Ergonomic Bar) ---
    function MobileBottomNav({ currentUser, currentTab, setCurrentTab, selectedCourse, onBackFromCourse, courseTab, setCourseTab, db, onOpenProfile }) {
      // When inside a course on mobile, show Course Sub-Navigation in the bottom bar for 1-thumb reach!
      if (selectedCourse) {
        const lessonCount = (db.Lessons || []).filter(l => l.CourseID === selectedCourse.CourseID && (currentUser.role !== 'student' || String(l.Published) !== 'false')).length;
        const assignCount = (db.Assignments || []).filter(a => a.CourseID === selectedCourse.CourseID).length;
        const examCount = (db.Exams || []).filter(e => e.CourseID === selectedCourse.CourseID && (currentUser.role !== 'student' || String(e.Published) !== 'false')).length;

        const courseNavItems = [
          { id: 'back', label: 'หน้าวิชา', icon: 'ArrowLeft', action: onBackFromCourse },
          { id: 'lessons', label: 'บทเรียน', icon: 'BookOpen', badge: lessonCount },
          { id: 'assignments', label: 'การบ้าน', icon: 'FileText', badge: assignCount },
          { id: 'exams', label: 'ข้อสอบ', icon: 'Clock', badge: examCount },
          { id: 'evaluations', label: 'ประเมินครู', icon: 'Star' }
        ];

        return (
          <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-[0_-4px_20px_rgba(15,23,42,0.06)] pb-safe">
            <div className="grid grid-cols-5 h-16 px-1">
              {courseNavItems.map(item => {
                const isActive = item.id !== 'back' && courseTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => item.action ? item.action() : setCourseTab(item.id)}
                    className={`flex flex-col items-center justify-center gap-1 relative transition active:scale-95 ${
                      item.id === 'back'
                        ? 'text-slate-500 hover:text-slate-800'
                        : isActive
                          ? 'text-indigo-600 font-extrabold'
                          : 'text-slate-500 font-medium'
                    }`}
                  >
                    {isActive && (
                      <span className="absolute top-0 inset-x-3 h-0.5 bg-indigo-600 rounded-b-full"></span>
                    )}
                    <div className="relative">
                      <Icon name={item.icon} size={20} />
                      {item.badge > 0 && (
                        <span className={`absolute -top-1.5 -right-2.5 min-w-[16px] h-4 px-1 rounded-full text-[10px] font-bold flex items-center justify-center ${
                          isActive ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-700'
                        }`}>
                          {item.badge}
                        </span>
                      )}
                    </div>
                    <span className="text-[10px] leading-none tracking-tight">{item.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        );
      }

      // Main Dashboard Bottom Nav
      const navItems = currentUser.role === 'admin'
        ? [
            { id: 'courses', label: 'รายวิชา', icon: 'BookOpen' },
            { id: 'students', label: 'นักเรียน', icon: 'Users' },
            { id: 'teachers', label: 'ครูผู้สอน', icon: 'UserCheck' },
            { id: 'ai_settings', label: 'ตั้งค่า AI', icon: 'Sparkles' },
            { id: 'settings', label: 'ตั้งค่าระบบ', icon: 'Settings' }
          ]
        : currentUser.role === 'teacher'
          ? [
              { id: 'courses', label: 'รายวิชาเรียน', icon: 'BookOpen' },
              { id: 'ai_settings', label: 'ตั้งค่า AI', icon: 'Sparkles' },
              { id: 'announcements', label: 'ประกาศ', icon: 'Bell' },
              { id: 'profile', label: 'บัญชีของฉัน', icon: 'User', action: onOpenProfile }
            ]
          : [
              { id: 'courses', label: 'รายวิชาเรียน', icon: 'BookOpen' },
              { id: 'announcements', label: 'ประกาศโรงเรียน', icon: 'Bell' },
              { id: 'profile', label: 'บัญชีของฉัน', icon: 'User', action: onOpenProfile }
            ];

      const gridColsClass = navItems.length === 5 ? 'grid-cols-5' : navItems.length === 4 ? 'grid-cols-4' : 'grid-cols-3';

      return (
        <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-[0_-4px_20px_rgba(15,23,42,0.06)] pb-safe">
          <div className={`grid ${gridColsClass} h-16 px-2`}>
            {navItems.map(item => {
              const isActive = item.id !== 'profile' && currentTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => item.action ? item.action() : setCurrentTab(item.id)}
                  className={`flex flex-col items-center justify-center gap-1 relative transition active:scale-95 ${
                    isActive ? 'text-indigo-600 font-extrabold' : 'text-slate-500 font-medium'
                  }`}
                >
                  {isActive && (
                    <span className="absolute top-0 inset-x-4 h-0.5 bg-indigo-600 rounded-b-full"></span>
                  )}
                  <Icon name={item.icon} size={20} />
                  <span className="text-[11px] leading-none tracking-tight">{item.label}</span>
                </button>
              );
            })}
          </div>
        </nav>
      );
    }

    // --- Mobile User Profile & Quick Action Sheet ---
    function MobileProfileModal({ currentUser, onClose, onShowAnnouncement, onRefresh, onLogout }) {
      const roleLabel = currentUser.role === 'admin' ? 'ผู้ดูแลระบบ (Admin)' : currentUser.role === 'teacher' ? 'ครูผู้สอน (Teacher)' : 'นักเรียน (Student)';
      const roleColor = currentUser.role === 'admin' ? 'bg-rose-100 text-rose-700' : currentUser.role === 'teacher' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700';

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm" onClick={onClose}>
          <div 
            className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl border-t sm:border border-slate-100 space-y-5 bottom-sheet pb-safe"

                <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-brand-500 text-white font-black text-xl flex items-center justify-center shadow-md shadow-indigo-500/20">
                  {(currentUser.user?.Name || 'A').charAt(0)}
                </div>
                <div>
                  <h3 className="text-base font-extrabold text-slate-900">
                    {currentUser.role === 'admin' ? 'ผู้ดูแลระบบกลาง' : currentUser.user?.Name}
                  </h3>
                  <div className="flex flex-wrap items-center gap-1.5 mt-1">
                    <span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold ${roleColor}`}>
                      {roleLabel}
                    </span>
                    {currentUser.role === 'student' && (
                      <span className="text-xs font-mono text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">
                        รหัส: {currentUser.user?.StudentID}
                      </span>
                    )}
                    {currentUser.role === 'student' && currentUser.user?.Grade && (
                      <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">
                        {currentUser.user?.Grade}

                    )}
                  </div>
                </div>
              </div>
              <button onClick={onClose} className="p-2 text-slate-400 hover:text-slate-600 rounded-xl bg-slate-100">
                <Icon name="X" size={18} />
              </button>
            </div>

            {currentUser.user?.Department && (
              <div className="px-4 py-2.5 bg-slate-50 rounded-2xl border border-slate-200/80 text-xs text-slate-600">
                <span className="font-bold text-slate-800">สังกัด: </span>{currentUser.user.Department}
              </div>
            )}

            <div className="grid grid-cols-2 gap-2.5 pt-1">
              <button
                onClick={onRefresh}
                className="flex items-center justify-center gap-2 p-3.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs rounded-2xl border border-indigo-100 transition active:scale-95"
              >
                <Icon name="RefreshCw" size={16} />
                <span>ซิงค์ข้อมูลล่าสุด</span>
              </button>
              <button
                onClick={onShowAnnouncement}

          const cleanId = studentId.trim();
          const cleanPin = pin.trim();
          const student = (db.Students || []).find(s => isSameStudentId(s.StudentID, cleanId));

          if (!student) {
            Swal.fire({
              icon: 'error',
              title: 'ไม่พบรหัสนักเรียน',
              text: `ไม่พบข้อมูลรหัส "${cleanId}" ในฐานข้อมูล (ลองใช้รหัสทดสอบ: 04501)`,
              confirmButtonColor: '#ef4444'
            });
            return;
          }

          if (student.PIN && String(cleanPin) !== String(student.PIN)) {
            Swal.fire({
              icon: 'error',
              title: 'PIN ไม่ถูกต้อง',
              text: 'รหัสผ่าน/PIN นักเรียนไม่ถูกต้อง (PIN เริ่มต้นคือ 1234)',
              confirmButtonColor: '#ef4444'

            return;

            icon: 'success',
            title: `ยินดีต้อนรับ ${student.Name}`,
            timer: 1200,
            showConfirmButton: false

          onLogin('student', student);

          const cleanEmail = teacherEmail.trim().toLowerCase();

            return;

          onLogin('teacher', teacher);

            timer: 1200,
            showConfirmButton: false

                            <button

                              title="ลบรายวิชา"

                            </button>
                          </div>

                        {course.Name}

                      <p className="text-xs text-white/80 mt-1 flex items-center gap-1">
                        <Icon name="UserCheck" size={13} />
                        <span>{course.TeacherName}</span>
                      </p>
                    </div>
                  </div>

                  <div className="p-5 flex-1 flex flex-col justify-between">
                    <div className="flex items-center justify-between text-xs text-slate-500 mb-4">
                      <span>น้ำหนัก: {course.Credits || '1.5'} หน่วยกิต</span>
                      <span className="flex items-center gap-1 text-indigo-600 font-semibold group-hover:translate-x-0.5 transition">
                        เข้าสู่ห้องเรียน
                        <Icon name="ChevronRight" size={15} />
                      </span>
                    </div>

                    <div className="w-full py-2 bg-slate-50 group-hover:bg-indigo-50 text-slate-700 group-hover:text-indigo-700 font-bold text-xs rounded-xl text-center border border-slate-200 group-hover:border-indigo-200 transition">
                      เข้าเรียน & ส่งงาน
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Modal Add/Edit Course */}
          {showModal && editingCourse && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="text-lg font-bold text-slate-900">
                    {courses.some(c => c.CourseID === editingCourse.CourseID) ? 'แก้ไขรายวิชา' : 'เพิ่มรายวิชาใหม่'}

                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="X" size={20} />

                <form onSubmit={handleSaveSubmit} className="space-y-4">

                        value={editingCourse.Code}

                      />

                      onChange={(e) => setEditingCourse({ ...editingCourse, Name: e.target.value })}

                    />

    // --- Course Detail Workspace Container ---
    function CourseDetailView({ course, db, currentUser, gasUrl, callGasApi, courseTab, setCourseTab, onBack, onSaveRecord, onDeleteRecord, onStartExam }) {

      const courseLessons = useMemo(() => {
        return (db.Lessons || [])
          .filter(l => l.CourseID === course.CourseID)
          .sort((a, b) => (parseInt(a.Order) || 0) - (parseInt(b.Order) || 0));
      }, [db.Lessons, course.CourseID]);

      const courseAssignments = useMemo(() => {
        return (db.Assignments || []).filter(a => a.CourseID === course.CourseID);
      }, [db.Assignments, course.CourseID]);

      const courseSubmissions = useMemo(() => {
        return (db.Submissions || []).filter(s => s.CourseID === course.CourseID);
      }, [db.Submissions, course.CourseID]);

      const courseExams = useMemo(() => {
        return (db.Exams || []).filter(e => e.CourseID === course.CourseID);
      }, [db.Exams, course.CourseID]);

      const courseExamAttempts = useMemo(() => {
        return (db.ExamAttempts || []).filter(ea => ea.CourseID === course.CourseID);
      }, [db.ExamAttempts, course.CourseID]);

      const courseEvaluations = useMemo(() => {
        return (db.Evaluations || []).filter(ev => ev.CourseID === course.CourseID);
      }, [db.Evaluations, course.CourseID]);

      return (
        <div className="space-y-4 sm:space-y-6">
          {/* Top Return & Course Banner */}
          <div className="space-y-2.5 sm:space-y-3">
            <button
              onClick={onBack}
              className="inline-flex items-center gap-2 px-3 py-1.5 bg-white hover:bg-slate-100 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:text-indigo-600 shadow-sm transition active:scale-95"
            >
              <Icon name="ArrowLeft" size={16} />
              <span>กลับหน้ารวมรายวิชา</span>
            </button>

            <div className={`bg-gradient-to-r ${course.CoverColor || 'from-indigo-600 to-blue-700'} rounded-3xl p-5 sm:p-8 text-white shadow-lg`}>
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="space-y-1">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="px-2.5 py-0.5 sm:px-3 sm:py-1 bg-white/20 backdrop-blur-md rounded-lg text-xs font-mono font-bold tracking-wider">
                      {course.Code}
                    </span>
                    <span className="text-[11px] sm:text-xs bg-black/20 px-2.5 py-0.5 sm:py-1 rounded-md">
                      {course.GradeLevel} • ภาคเรียน {course.Term}

                  </div>
                  <h1 className="text-xl sm:text-3xl font-black tracking-tight leading-snug">{course.Name}</h1>
                  <p className="text-xs sm:text-sm text-white/85 flex items-center gap-1.5 pt-0.5">
                    <Icon name="UserCheck" size={15} />
                    <span>ครูผู้สอน: {course.TeacherName}</span>
                  </p>
                </div>

                <div className="hidden sm:block bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/15 text-center min-w-[130px]">
                  <span className="text-2xl font-black block">{courseLessons.length}</span>
                  <span className="text-[11px] text-white/80 font-medium">บทเรียนในวิชา</span>
                </div>
              </div>

              {/* Sub Navigation Bar within Course (Scrollable Pills on Mobile, Full Buttons on Desktop) */}
              <div className="grid grid-cols-2 sm:flex sm:flex-wrap gap-2 pt-4 mt-4 sm:pt-6 sm:mt-6 border-t border-white/20">
                <button
                  onClick={() => setCourseTab('lessons')}
                  className={`px-3 py-2.5 sm:px-4 sm:py-2 rounded-xl text-xs font-bold transition flex items-center justify-center sm:justify-start gap-1.5 ${
                    courseTab === 'lessons' ? 'bg-white text-indigo-700 shadow-md' : 'bg-white/10 text-white hover:bg-white/20'
                  }`}
                >
                  <Icon name="BookOpen" size={15} />
                  <span>บทเรียน ({courseLessons.length})</span>
                </button>

                <button
                  onClick={() => setCourseTab('assignments')}
                  className={`px-3 py-2.5 sm:px-4 sm:py-2 rounded-xl text-xs font-bold transition flex items-center justify-center sm:justify-start gap-1.5 ${
                    courseTab === 'assignments' ? 'bg-white text-indigo-700 shadow-md' : 'bg-white/10 text-white hover:bg-white/20'
                  }`}
                >
                  <Icon name="FileText" size={15} />
                  <span>การบ้าน ({courseAssignments.length})</span>
                </button>

                <button
                  onClick={() => setCourseTab('exams')}
                  className={`px-3 py-2.5 sm:px-4 sm:py-2 rounded-xl text-xs font-bold transition flex items-center justify-center sm:justify-start gap-1.5 ${
                    courseTab === 'exams' ? 'bg-white text-indigo-700 shadow-md' : 'bg-white/10 text-white hover:bg-white/20'
                  }`}
                >
                  <Icon name="Clock" size={15} />
                  <span>ข้อสอบ ({courseExams.length})</span>
                </button>

                <button
                  onClick={() => setCourseTab('evaluations')}
                  className={`px-3 py-2.5 sm:px-4 sm:py-2 rounded-xl text-xs font-bold transition flex items-center justify-center sm:justify-start gap-1.5 ${
                    courseTab === 'evaluations' ? 'bg-white text-indigo-700 shadow-md' : 'bg-white/10 text-white hover:bg-white/20'
                  }`}
                >
                  <Icon name="Star" size={15} />
                  <span>ประเมินครู</span>
                </button>
              </div>
            </div>
          </div>

          {/* Module Content Switcher */}
          <div>
            {courseTab === 'lessons' && (
              <LessonsView
                course={course}
                lessons={courseLessons}
                currentUser={currentUser}
                onSaveLesson={(l) => onSaveRecord('Lessons', l)}
                onDeleteLesson={(id) => onDeleteRecord('Lessons', id)}
              />
            )}

            {courseTab === 'assignments' && (
              <AssignmentsView
                course={course}
                assignments={courseAssignments}
                submissions={courseSubmissions}
                currentUser={currentUser}
                gasUrl={gasUrl}
                callGasApi={callGasApi}
                onSaveAssignment={(a) => onSaveRecord('Assignments', a)}
                onDeleteAssignment={(id) => onDeleteRecord('Assignments', id)}
                onSaveSubmission={(s) => onSaveRecord('Submissions', s)}
              />
            )}

            {courseTab === 'exams' && (
              <ExamsView
                course={course}
                exams={courseExams}
                attempts={courseExamAttempts}
                currentUser={currentUser}
                onStartExam={onStartExam}
                onSaveExam={(ex) => onSaveRecord('Exams', ex)}
                onDeleteExam={(id) => onDeleteRecord('Exams', id)}
              />
            )}

            {courseTab === 'evaluations' && (
              <EvaluationsView
                course={course}
                evaluations={courseEvaluations}
                currentUser={currentUser}
                gasUrl={gasUrl}
                callGasApi={callGasApi}
                onSaveEvaluation={(ev) => onSaveRecord('Evaluations', ev)}
              />
            )}
          </div>
        </div>
      );
    }

    function getAiConfig() {
      try {
        const raw = localStorage.getItem('eduportal_ai_config');
        const legacyGeminiKey = localStorage.getItem('eduportal_gemini_api_key') || '';
        if (!raw) {
          return {
            ...DEFAULT_AI_CONFIG,
            selectedModelId: legacyGeminiKey ? 'gemini-2.0-flash' : 'builtin-smart-thai',
            keys: { ...DEFAULT_AI_CONFIG.keys, geminiKey: legacyGeminiKey }
          };
        }
        const parsed = JSON.parse(raw);
        return {
          ...DEFAULT_AI_CONFIG,
          ...parsed,
          keys: {
            ...DEFAULT_AI_CONFIG.keys,
            geminiKey: legacyGeminiKey || parsed?.keys?.geminiKey || '',
            ...(parsed?.keys || {})
          }
        };
      } catch {
        return { ...DEFAULT_AI_CONFIG };
      }
    }

    function saveAiConfig(nextConfig) {
      const merged = {
        ...getAiConfig(),
        ...nextConfig,
        keys: {
          ...getAiConfig().keys,
          ...(nextConfig.keys || {})
        }
      };
      localStorage.setItem('eduportal_ai_config', JSON.stringify(merged));
      if (merged.keys.geminiKey !== undefined) {
        localStorage.setItem('eduportal_gemini_api_key', merged.keys.geminiKey);
      }
      return merged;
    }

      const normalizeParsedLessons = (parsedArray, usedModelName) => {
        return parsedArray.map((item, idx) => {

            { title: `📚 สื่อการสอน สสวท. / Proj14`, url: `https://proj14.ipst.ac.th/` }
          ];
          return {

            Title: item.Title || `บทที่ ${orderNum}: ${cleanTopic}`,

    // --- Rich Lesson Content Formatter, Renderer & WYSIWYG Editor (Fonts, Alignment, Image URL, Code Block, Inline Frame) ---
    function isHtmlLessonContent(text) {
      if (!text || typeof text !== 'string') return false;
      return /<(h[1-6]|p|div|ul|ol|li|pre|code|img|iframe|table|blockquote|figure|span|strong|em|b|i|u|hr)\b/i.test(text);
    }

    function escapeHtmlSafe(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Converts plain-text lesson descriptions (or AI output) into clean, structured HTML
    function convertPlainLessonToRichHtml(rawText) {
      if (!rawText || !rawText.trim()) return '';
      if (isHtmlLessonContent(rawText)) return rawText;

      const lines = rawText.split(/\r?\n/);
      const htmlParts = [];
      let inUl = false;
      let inOl = false;

      const closeLists = () => {
        if (inUl) { htmlParts.push('</ul>'); inUl = false; }
        if (inOl) { htmlParts.push('</ol>'); inOl = false; }
      };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) {
          closeLists();
          continue;
        }

        // Section Headers (e.g., 🎯 จุดประสงค์..., 📖 สาระสำคัญ..., 💡 ตัวอย่าง..., 📝 กิจกรรม...)
        if (/^(🎯|📖|💡|📝|📌|✨|🔥|✅|ส่วนที่|หัวข้อที่|บทนำ)/.test(line) && line.length < 110) {
          closeLists();
          htmlParts.push(`<h3>${escapeHtmlSafe(line)}</h3>`);
          continue;
        }

        // Bullet points (•, -, *)
        if (/^[•\-*]\s+/.test(line)) {
          if (inOl) { htmlParts.push('</ol>'); inOl = false; }
          if (!inUl) { htmlParts.push('<ul>'); inUl = true; }
          const itemText = line.replace(/^[•\-*]\s+/, '');
          htmlParts.push(`<li>${escapeHtmlSafe(itemText)}</li>`);
          continue;
        }

        // Numbered list (1. , 2. )
        if (/^\d+[\.)]\s+/.test(line)) {
          if (inUl) { htmlParts.push('</ul>'); inUl = false; }
          if (!inOl) { htmlParts.push('<ol>'); inOl = true; }
          const itemText = line.replace(/^\d+[\.)]\s+/, '');
          htmlParts.push(`<li>${escapeHtmlSafe(itemText)}</li>`);
          continue;
        }

        closeLists();
        htmlParts.push(`<p>${escapeHtmlSafe(line)}</p>`);
      }

      closeLists();
      return htmlParts.join('\n');
    }

    // Normalizes any URL or <iframe> snippet into an embeddable URL for Inline Frame
    function normalizeIframeEmbedUrl(inputStr) {
      const trimmed = (inputStr || '').trim();
      if (!trimmed) return '';

      // If user pasted full <iframe ... src="..."></iframe> code, extract src
      const srcMatch = trimmed.match(/src=["']([^"']+)["']/i);
      const rawUrl = srcMatch ? srcMatch[1].trim() : trimmed;

      // Convert YouTube watch/short URLs to embed
      const ytEmbed = getEmbedUrl(rawUrl);
      if (ytEmbed && (rawUrl.includes('youtube.com') || rawUrl.includes('youtu.be') || rawUrl.includes('drive.google.com'))) {
        return ytEmbed;
      }

      // Convert Canva view link to embed if needed
      if (rawUrl.includes('canva.com/design/') && !rawUrl.includes('?embed')) {
        const baseCanva = rawUrl.split('?')[0].replace(/\/edit$/, '/view');
        return `${baseCanva}?embed`;
      }

      return rawUrl;
    }

    // Component to render Rich Lesson Content safely and beautifully for Students & Teachers
    function LessonRichContentRenderer({ content }) {
      const htmlToRender = useMemo(() => {
        if (!content) return '';
        return isHtmlLessonContent(content) ? content : convertPlainLessonToRichHtml(content);
      }, [content]);

      if (!htmlToRender) return null;

      return (
        <div
          className="lesson-rich-content text-xs sm:text-sm mt-2.5 bg-slate-50/60 p-4 sm:p-5 rounded-2xl border border-slate-100"
          dangerouslySetInnerHTML={{ __html: htmlToRender }}
        />
      );
    }

    // --- Module 1: Lessons & Learning Materials ---
    function LessonsView({ course, lessons, currentUser, onSaveLesson, onDeleteLesson }) {
      const [activeVideoId, setActiveVideoId] = useState(null);
      const [showModal, setShowModal] = useState(false);
      const [showAiModal, setShowAiModal] = useState(false);
      const [editingLesson, setEditingLesson] = useState(null);
      const [isSingleAiGenerating, setIsSingleAiGenerating] = useState(false);

      const visibleLessons = currentUser.role === 'student'
        ? lessons.filter(l => String(l.Published) !== 'false')
        : lessons;

      const handleOpenAdd = () => {
        setEditingLesson({
          LessonID: 'L' + Date.now().toString().slice(-4),
          CourseID: course.CourseID,
          Title: '',
          Description: '',
          VideoURL: '',
          AttachmentsJSON: JSON.stringify([]),
          Order: String(lessons.length + 1),
          Published: 'true',
          CreatedAt: new Date().toISOString().split('T')[0]
        });
        setShowModal(true);
      };

      const handleOpenEdit = (l) => {
        setEditingLesson({ ...l });
        setShowModal(true);
      };

      const handleDelete = (id) => {
        Swal.fire({
          title: 'ลบบทเรียนนี้?',
          text: 'เนื้อหาและวิดีโอในบทเรียนนี้จะถูกนำออก',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'ลบบทเรียน',
          cancelButtonText: 'ยกเลิก',
          confirmButtonColor: '#ef4444'
        }).then((result) => {
          if (result.isConfirmed) {
            onDeleteLesson(id);
            Swal.fire({ icon: 'success', title: 'ลบบทเรียนเรียบร้อย', timer: 1200, showConfirmButton: false });
          }
        });
      };

      const handleTogglePublish = (lesson) => {
        const nextPub = String(lesson.Published) === 'false' ? 'true' : 'false';
        onSaveLesson({ ...lesson, Published: nextPub });
        Swal.fire({
          icon: 'success',
          title: nextPub === 'true' ? 'เผยแพร่บทเรียนแล้ว' : 'ซ่อนบทเรียนแล้ว',
          timer: 1000,
          showConfirmButton: false
        });
      };

      const handleSaveSubmit = (e) => {
        e.preventDefault();
        onSaveLesson(editingLesson);
        setShowModal(false);
        Swal.fire({ icon: 'success', title: 'บันทึกบทเรียนสำเร็จ', timer: 1200, showConfirmButton: false });
      };

      // Quick AI Auto-Fill inside the Single Lesson Modal
      const handleQuickAiFillModal = async () => {
        const topicToUse = (editingLesson?.Title || '').replace(/^บทที่\s*\d+\s*:\s*/i, '').trim() || course.Name;
        setIsSingleAiGenerating(true);
        try {
          const res = await generateAiLessonsEngine({
            course,
            topic: topicToUse,
            lessonCount: 1,
            style: getAiConfig().defaultStyle || 'practical',
            startOrder: parseInt(editingLesson?.Order) || (lessons.length + 1)
          });
          if (res && res[0]) {
            const cleanItem = { ...res[0] };
            const usedModel = cleanItem._generatedByModel || 'AI';
            delete cleanItem._generatedByModel;
            setEditingLesson(prev => ({
              ...prev,
              Title: prev.Title.trim() ? prev.Title : cleanItem.Title,
              Description: cleanItem.Description,
              VideoURL: prev.VideoURL.trim() ? prev.VideoURL : cleanItem.VideoURL,
              AttachmentsJSON: cleanItem.AttachmentsJSON
            }));
            Swal.fire({
              icon: 'success',
              title: `✨ ${usedModel} ร่างเนื้อหาให้แล้ว!`,
              text: 'คุณสามารถปรับแก้ข้อความ ลิงก์วิดีโอ หรือเอกสารแนบก่อนกดบันทึกได้ทันที',
              timer: 1600,
              showConfirmButton: false
            });
          }
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'ไม่สามารถเชื่อมต่อโมเดล AI ได้', text: err.message || 'กรุณาตรวจสอบ API Key ในหน้าตั้งค่า AI' });
        } finally {
          setIsSingleAiGenerating(false);
        }
      };

    // --- Modal: AI Automatic Lesson & Curriculum Generator (Multi-Model Free & Paid Selector) ---
    function AiLessonGeneratorModal({ course, existingCount, onClose, onSaveGeneratedLessons }) {
      const initialConfig = useMemo(() => getAiConfig(), []);
      const [selectedModelId, setSelectedModelId] = useState(initialConfig.selectedModelId || 'builtin-smart-thai');
      const [topic, setTopic] = useState('');
      const [lessonCount, setLessonCount] = useState('3');
      const [style, setStyle] = useState(initialConfig.defaultStyle || 'practical');
      const [providerKey, setProviderKey] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [previewLessons, setPreviewLessons] = useState([]);

      const currentModel = useMemo(
        () => AI_MODELS_CATALOG.find(m => m.id === selectedModelId) || AI_MODELS_CATALOG[0],
        [selectedModelId]
      );

      // Load saved key whenever selectedModelId changes
      useEffect(() => {
        const cfg = getAiConfig();
        if (currentModel.keyField) {
          setProviderKey(cfg.keys?.[currentModel.keyField] || '');
        } else {
          setProviderKey('');
        }
      }, [selectedModelId, currentModel]);

      const freeModels = useMemo(() => AI_MODELS_CATALOG.filter(m => m.tier === 'free'), []);
      const paidModels = useMemo(() => AI_MODELS_CATALOG.filter(m => m.tier === 'paid'), []);

      // Smart topic suggestions based on course name
      const suggestedTopics = useMemo(() => {
        const name = (course.Name || '').toLowerCase();
        if (name.includes('คอม') || name.includes('คำนวณ') || name.includes('ai') || name.includes('ปัญญาประดิษฐ์')) {
          return ['ปัญญาประดิษฐ์ (AI) ในชีวิตประจำวัน', 'การคิดเชิงคำนวณ (Computational Thinking)', 'การเขียนโปรแกรมด้วย Python เบื้องต้น', 'จริยธรรมและความปลอดภัยทางไซเบอร์'];
        }
        if (name.includes('คณิต')) {
          return ['สมการเชิงเส้นตัวแปรเดียว', 'ทฤษฎีบทพีทาโกรัส', 'สถิติและการวิเคราะห์ข้อมูล', 'ความน่าจะเป็นในชีวิตประจำวัน'];
        }
        if (name.includes('วิทย์') || name.includes('วิทยาศาสตร์')) {
          return ['ระบบนิเวศและสิ่งแวดล้อม', 'แรงและการเคลื่อนที่ของวัตถุ', 'โครงสร้างและหน้าที่ของเซลล์', 'พลังงานทดแทนและเทคโนโลยีสะอาด'];
        }
        if (name.includes('ไทย')) {
          return ['การอ่านจับใจความสำคัญและการคิดวิเคราะห์', 'การเขียนสื่อสารและย่อความ', 'วรรณคดีวิจักษ์และคุณค่าทางวรรณศิลป์', 'คำราชาศัพท์และระดับภาษา'];
        }
        if (name.includes('อังกฤษ') || name.includes('english')) {
          return ['Everyday English Conversation', 'Reading Comprehension Strategies', 'Essential Grammar & Tenses', 'Writing Emails & Short Paragraphs'];
        }

    // --- Module 2: Assignments & Google Drive Submissions ---
    function AssignmentsView({ course, assignments, submissions, currentUser, gasUrl, callGasApi, onSaveAssignment, onDeleteAssignment, onSaveSubmission }) {
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingAssignment, setEditingAssignment] = useState(null);
      const [gradingSubmission, setGradingSubmission] = useState(null);
      const [viewingAssignmentSubmissions, setViewingAssignmentSubmissions] = useState(null);
      const [submittingAssignId, setSubmittingAssignId] = useState(null);

      // Student Submission State
      const [uploadFile, setUploadFile] = useState(null);
      const [studentNote, setStudentNote] = useState('');
      const [isUploading, setIsUploading] = useState(false);

      // Teacher Grading State
      const [scoreInput, setScoreInput] = useState('');
      const [feedbackInput, setFeedbackInput] = useState('');

      const handleOpenAdd = () => {
        setEditingAssignment({
          AssignmentID: 'A' + Date.now().toString().slice(-4),
          CourseID: course.CourseID,
          Title: '',
          Description: '',
          MaxScore: '10',
          DueDate: new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 16),
          AttachmentsJSON: '[]',
          CreatedAt: new Date().toISOString().split('T')[0]
        });
        setShowAddModal(true);
      };

      const handleDelete = (id) => {
        Swal.fire({
          title: 'ลบการบ้านนี้?',
          text: 'ข้อมูลการส่งงานของนักเรียนทั้งหมดจะถูกลบไปด้วย',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'ยืนยันการลบ',
          cancelButtonText: 'ยกเลิก',
          confirmButtonColor: '#ef4444'
        }).then((result) => {
          if (result.isConfirmed) {
            onDeleteAssignment(id);
            Swal.fire({ icon: 'success', title: 'ลบการบ้านเรียบร้อย', timer: 1200, showConfirmButton: false });
          }
        });
      };

      const handleSaveAssignmentSubmit = (e) => {
        e.preventDefault();
        onSaveAssignment(editingAssignment);
        setShowAddModal(false);
        Swal.fire({ icon: 'success', title: 'บันทึกการบ้านสำเร็จ', timer: 1200, showConfirmButton: false });
      };

      // Student submits file & note -> uploads to Google Drive via GAS
      const handleStudentSubmit = async (assignment) => {
        if (!uploadFile && !studentNote.trim()) {
          Swal.fire({
            icon: 'warning',
            title: 'กรุณาแนบไฟล์หรือเขียนข้อความ',
            text: 'โปรดเลือกไฟล์งานที่จะส่งหรือพิมพ์ข้อความถึงครู',
            confirmButtonColor: '#4f46e5'
          });
          return;
        }

        setIsUploading(true);
        Swal.fire({
          title: 'กำลังอัปโหลดไฟล์ส่งงาน...',
          text: 'แปลงไฟล์และส่งเข้าสู่ Google Drive ของโรงเรียน',
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        try {
          let fileData = null;
          if (uploadFile) {
            fileData = await fileToBase64(uploadFile);
          }

          const existingSub = submissions.find(
            s => s.AssignmentID === assignment.AssignmentID && isSameStudentId(s.StudentID, currentUser.user.StudentID)
          );

          const submissionPayload = {
            ID: existingSub?.ID || ('SUB_' + Date.now().toString().slice(-6)),
            AssignmentID: assignment.AssignmentID,
            CourseID: course.CourseID,
            StudentID: currentUser.user.StudentID,
            StudentName: currentUser.user.Name,
            Grade: currentUser.user.Grade || '',
            FileName: uploadFile ? uploadFile.name : (existingSub?.FileName || ''),
            FileUrl: existingSub?.FileUrl || '',
            DriveFileID: existingSub?.DriveFileID || '',
            Note: studentNote,
            SubmittedAt: new Date().toLocaleString('th-TH'),
            Score: existingSub?.Score || '',
            Feedback: existingSub?.Feedback || '',
            Status: 'Submitted'
          };

          if (gasUrl) {
            const res = await callGasApi('submitAssignment', {
              submission: submissionPayload,
              fileData: fileData
            });

            if (res && res.result && res.result.isNew !== undefined) {
              // updated
              if (res.file) {
                submissionPayload.FileUrl = res.file.fileUrl;
                submissionPayload.DriveFileID = res.file.driveFileId;
              }
            }
          } else {
            // Local fallback simulation
            if (uploadFile) {
              submissionPayload.FileUrl = 'https://placehold.co/800x600/e0e7ff/4f46e5?text=' + encodeURIComponent(uploadFile.name);
            }
          }

          onSaveSubmission(submissionPayload);
          setSubmittingAssignId(null);
          setUploadFile(null);
          setStudentNote('');

          Swal.fire({
            icon: 'success',
            title: 'ส่งงานเรียบร้อยแล้ว!',
            text: 'ไฟล์ของคุณถูกบันทึกเข้า Google Drive และตารางเรียบร้อย',
            confirmButtonColor: '#4f46e5'
          });
        } catch (error) {
          console.error(error);
          Swal.fire({

    // --- Smart AI Exam Question Generator Engine (Supports Per-Question & Multi-Question Generation across Free & Paid AI Models) ---
    async function generateAiExamQuestionsEngine({
      course,
      examTitle = '',
      topic = '',
      questionCount = 1,
      difficulty = 'medium',
      scorePerQuestion = 5,
      questionIndexHint = 0,
      existingQuestions = [],
      modelId = ''
    }) {
      const aiConfig = getAiConfig();
      const targetModelId = modelId || aiConfig.selectedModelId || 'builtin-smart-thai';
      const selectedModel = AI_MODELS_CATALOG.find(m => m.id === targetModelId) || AI_MODELS_CATALOG[0];

      const courseName = course?.Name || 'รายวิชาเรียน';
      const grade = course?.GradeLevel || 'มัธยมศึกษา';
      const cleanTopic = (topic || examTitle || courseName || 'ความรู้พื้นฐานประจำวิชา').trim();
      const count = Math.min(Math.max(parseInt(questionCount) || 1, 1), 15);
      const pts = parseInt(scorePerQuestion) || 5;
      const temp = Number(aiConfig.temperature) || 0.7;

      const diffLabels = {
        easy: 'ระดับง่าย (วัดความจำและความเข้าใจพื้นฐาน)',
        medium: 'ระดับปานกลาง (วัดความเข้าใจและการนำไปใช้)',
        hard: 'ระดับยาก (วัดการคิดวิเคราะห์และการแก้โจทย์สถานการณ์)',
        mixed: 'คละระดับความยาก (ตั้งแต่ความเข้าใจพื้นฐานไปจนถึงการวิเคราะห์)'
      };
      const diffDesc = diffLabels[difficulty] || diffLabels.medium;

      const avoidListText = existingQuestions.length > 0
        ? `\nหลีกเลี่ยงการตั้งคำถามซ้ำกับโจทย์ที่มีอยู่แล้วเหล่านี้:\n${existingQuestions.slice(-6).map((q, i) => `- ${q.text}`).join('\n')}`
        : '';

      const promptText = `คุณคือครูผู้เชี่ยวชาญการออกข้อสอบวัดผลระดับโรงเรียนไทย
กรุณาสร้างข้อสอบปรนัย 4 ตัวเลือก จำนวน ${count} ข้อ สำหรับรายวิชา "${courseName}" (ระดับชั้น ${grade})
หัวข้อ/ประเด็นที่ออกสอบ: "${cleanTopic}"
ระดับความยาก: ${diffDesc}${avoidListText}

ส่งผลลัพธ์กลับมาเป็น JSON Array เท่านั้น (ห้ามมี Markdown คั่น) โดยแต่ละ Object มีโครงสร้างดังนี้:
[
  {
    "text": "โจทย์คำถามที่ชัดเจน วัดความเข้าใจตรงตามหัวข้อ (ไม่ต้องใส่เลขข้อนำหน้า)",
    "options": [
      "ตัวเลือกที่ 1 (ไม่มี ก. ข. ค. ง. นำหน้า)",
      "ตัวเลือกที่ 2",
      "ตัวเลือกที่ 3",
      "ตัวเลือกที่ 4"
    ],
    "answerIndex": 0,
    "explanation": "คำอธิบายเฉลยสั้นๆ ว่าทำไมข้อนี้ถึงถูกต้อง"
  }
]
หมายเหตุ: กระจายตำแหน่งเฉลย (answerIndex มีค่าระหว่าง 0 ถึง 3) ให้สมดุล ไม่เฉลยแต่ข้อแรก`;

      const extractJsonArray = (rawText) => {
        if (!rawText) return null;
        const cleaned = rawText.replace(/^```json\s*|\s*```$/g, '').trim();
        try {
          const direct = JSON.parse(cleaned);
          if (Array.isArray(direct)) return direct;
          if (direct && Array.isArray(direct.questions)) return direct.questions;
        } catch {
          const match = cleaned.match(/\[[\s\S]*\]/);
          if (match) {
            try {
              const arr = JSON.parse(match[0]);
              if (Array.isArray(arr)) return arr;
            } catch {}
          }
        }
        return null;
      };

      const normalizeQuestions = (parsedArr, usedModelName) => {
        return parsedArr.map((item, idx) => {
          const rawOpts = Array.isArray(item.options) && item.options.length >= 4
            ? item.options.slice(0, 4).map(o => String(o || '').replace(/^[กขคงABCD1234][\.\)\s]+/i, '').trim())
            : ['ตัวเลือกที่ 1', 'ตัวเลือกที่ 2', 'ตัวเลือกที่ 3', 'ตัวเลือกที่ 4'];
          const ansIdx = typeof item.answerIndex === 'number' && item.answerIndex >= 0 && item.answerIndex <= 3
            ? item.answerIndex
            : 0;
          return {
            id: 'q_' + Date.now() + '_' + (questionIndexHint + idx) + '_' + Math.random().toString(36).slice(2, 5),
            text: String(item.text || `ข้อใดกล่าวถูกต้องเกี่ยวกับ ${cleanTopic}?`).replace(/^ข้อ(ที่)?\s*\d+[\.\:\)]\s*/i, '').trim(),
            options: rawOpts,
            answerIndex: ansIdx,
            score: pts,
            explanation: item.explanation || '',
            _generatedByModel: usedModelName
          };
        });
      };

      const providerKey = (selectedModel.keyField ? aiConfig.keys?.[selectedModel.keyField] : '') || '';

      // 1. Try External AI Provider if selected
      if (selectedModel.provider !== 'builtin') {
        try {
          if (selectedModel.provider === 'gemini' && providerKey.trim()) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel.modelCode}:generateContent?key=${encodeURIComponent(providerKey.trim())}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }],
                generationConfig: { temperature: temp, responseMimeType: 'application/json' }
              })
            });
            if (response.ok) {
              const data = await response.json();
              const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
              const parsed = extractJsonArray(rawText);
              if (parsed && parsed.length > 0) return normalizeQuestions(parsed, selectedModel.name);
            }
          }

          if (selectedModel.provider === 'pollinations') {
            const response = await fetch('https://text.pollinations.ai/openai', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'openai',
                messages: [
                  { role: 'system', content: 'You are an expert Thai school exam designer. Return a valid JSON array of multiple-choice questions only.' },
                  { role: 'user', content: promptText }
                ],
                temperature: temp
              })
            });
            if (response.ok) {
              const data = await response.json();
              const rawText = data?.choices?.[0]?.message?.content || '';
              const parsed = extractJsonArray(rawText);
              if (parsed && parsed.length > 0) return normalizeQuestions(parsed, selectedModel.name);
            }
          }

          if (['openai', 'groq', 'deepseek', 'openrouter'].includes(selectedModel.provider) && providerKey.trim()) {
            const endpointMap = {
              openai: 'https://api.openai.com/v1/chat/completions',
              groq: 'https://api.groq.com/openai/v1/chat/completions',
              deepseek: 'https://api.deepseek.com/chat/completions',
              openrouter: 'https://openrouter.ai/api/v1/chat/completions'
            };
            const targetModelCode = selectedModel.id === 'openrouter-custom'
              ? (aiConfig.customOpenRouterModel || selectedModel.modelCode)
              : selectedModel.modelCode;
            const headers = {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${providerKey.trim()}`
            };
            if (selectedModel.provider === 'openrouter') {
              headers['HTTP-Referer'] = window.location.origin || 'https://eduportal.school';
              headers['X-Title'] = 'EduPortal LMS';
            }
            const response = await fetch(endpointMap[selectedModel.provider], {
              method: 'POST',
              headers,
              body: JSON.stringify({
                model: targetModelCode,
                messages: [
                  { role: 'system', content: 'คุณคือผู้ออกข้อสอบโรงเรียนไทย ตอบกลับเป็น JSON Array เท่านั้น' },
                  { role: 'user', content: promptText }
                ],
                temperature: temp
              })
            });
            if (response.ok) {
              const data = await response.json();
              const rawText = data?.choices?.[0]?.message?.content || '';
              const parsed = extractJsonArray(rawText);
              if (parsed && parsed.length > 0) return normalizeQuestions(parsed, selectedModel.name);
            }
          }

          if (selectedModel.provider === 'anthropic' && providerKey.trim()) {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': providerKey.trim(),
                'anthropic-version': '2023-06-01',
                'anthropic-dangerous-direct-browser-access': 'true'
              },
              body: JSON.stringify({
                model: selectedModel.modelCode,
                max_tokens: 3000,
                temperature: temp,
                messages: [{ role: 'user', content: promptText }]
              })
            });
            if (response.ok) {
              const data = await response.json();
              const rawText = data?.content?.[0]?.text || '';
              const parsed = extractJsonArray(rawText);
              if (parsed && parsed.length > 0) return normalizeQuestions(parsed, selectedModel.name);
            }
          }
        } catch (err) {
          console.warn('AI Exam Generator fallback to Built-in Smart Exam Engine:', err);
          if (!aiConfig.autoFallbackToFree) throw err;
        }
      }

      // 2. Built-in Smart Thai Exam Question Generator (Works 100% Free & Instant)
      await new Promise(r => setTimeout(r, 450));

      const blueprintTemplates = [
        {
          stem: (tp) => `ข้อใดอธิบายความหมายและหลักการสำคัญของ "${tp}" ได้ถูกต้องและครอบคลุมที่สุด?`,
          correct: (tp) => `กระบวนการทำความเข้าใจแก่นหลักของ${tp}อย่างเป็นระบบ พร้อมนำไปประยุกต์ใช้ตามบริบทจริง`,
          distractors: (tp) => [
            `การท่องจำเฉพาะคำนิยามของ${tp}โดยไม่ต้องพิจารณาความสัมพันธ์ของข้อมูล`,
            `การเลือกใช้ข้อมูลเพียงด้านเดียวของ${tp}เพื่อสรุปผลอย่างรวดเร็ว`,
            `การตัดขั้นตอนการตรวจสอบความถูกต้องออกเพื่อประหยัดเวลาในการทำงาน`
          ],
          explanation: (tp) => `หัวใจสำคัญของ "${tp}" คือความเข้าใจเชิงระบบและการนำไปประยุกต์ใช้ได้อย่างเหมาะสม`
        },
        {
          stem: (tp) => `หากนักเรียนต้องการนำความรู้เรื่อง "${tp}" ไปประยุกต์ใช้แก้ปัญหาในสถานการณ์จริง ควรเริ่มต้นจากขั้นตอนใดเป็นอันดับแรก?`,
          correct: (tp) => `วิเคราะห์ปัญหา ระบุข้อมูลสำคัญ และกำหนดเป้าหมายที่เกี่ยวข้องกับ${tp}ให้ชัดเจน`,
          distractors: (tp) => [
            `ลงมือปฏิบัติทันทีโดยไม่ต้องวางแผนล่วงหน้า`,
            `คัดลอกวิธีการของผู้อื่นมาใช้ทั้งหมดโดยไม่ปรับให้เข้ากับปัญหา`,
            `สรุปผลการดำเนินงานก่อนเริ่มรวบรวมข้อมูลจริง`
          ],
          explanation: (tp) => `การแก้ปัญหาอย่างเป็นระบบต้องเริ่มจากการวิเคราะห์ปัญหาและรวบรวมข้อมูลที่เกี่ยวข้องก่อนเสมอ`
        },
        {
          stem: (tp) => `ข้อใดคือประโยชน์ที่สำคัญที่สุดของการศึกษาและทำความเข้าใจเรื่อง "${tp}" ในระดับชั้น ${grade}?`,
          correct: (tp) => `ช่วยให้สามารถคิดวิเคราะห์ เชื่อมโยงเหตุผล และนำองค์ความรู้ไปต่อยอดในระดับที่สูงขึ้นได้`,
          distractors: (tp) => [
            `ทำให้ไม่ต้องศึกษาค้นคว้าหาความรู้เพิ่มเติมจากแหล่งเรียนรู้อื่นอีก`,
            `ช่วยลดความสำคัญของการทำงานร่วมกับผู้อื่นในชั้นเรียน`,
            `ใช้สำหรับตอบคำถามในห้องเรียนเท่านั้น ไม่สามารถใช้ในชีวิตประจำวันได้`
          ],
          explanation: (tp) => `การเรียนรู้เรื่อง "${tp}" มุ่งเน้นพัฒนาทักษะการคิดวิเคราะห์และการต่อยอดองค์ความรู้`
        },
        {
          stem: (tp) => `ในการตรวจสอบความถูกต้องของผลงานหรือผลลัพธ์ที่เกี่ยวกับ "${tp}" ข้อใดเป็นแนวทางปฏิบัติที่เหมาะสมที่สุด?`,
          correct: (tp) => `ตรวจสอบความสมเหตุสมผลของผลลัพธ์เทียบกับหลักการและเกณฑ์มาตรฐานที่กำหนดไว้`,
          distractors: (tp) => [
            `ดูเฉพาะความสวยงามภายนอกโดยไม่ต้องตรวจสอบเนื้อหาหลัก`,
            `เลือกเชื่อข้อมูลชุดแรกที่พบโดยไม่ต้องเปรียบเทียบกับแหล่งอ้างอิงอื่น`,
            `ข้ามขั้นตอนการตรวจสอบหากมั่นใจว่าทำเสร็จเร็วที่สุด`
          ],
          explanation: (tp) => `การตรวจสอบเทียบกับหลักการและเกณฑ์มาตรฐานช่วยให้มั่นใจในความถูกต้องและน่าเชื่อถือของผลลัพธ์`
        },
        {
          stem: (tp) => `สถานการณ์ใดต่อไปนี้แสดงถึงการนำหลักการของ "${tp}" ไปประยุกต์ใช้ได้อย่างมีประสิทธิภาพสูงสุด?`,
          correct: (tp) => `การนำหลักการของ${tp}มาวางแผนแก้ปัญหาในโรงเรียนหรือชีวิตประจำวันอย่างมีเหตุผลและวัดผลได้`,
          distractors: (tp) => [
            `การจดบันทึกเนื้อหา${tp}ลงสมุดโดยไม่เคยนำมาทดลองฝึกปฏิบัติ`,
            `การนำข้อมูลที่ยังไม่ผ่านการคัดกรองมาสรุปอ้างอิงทันที`,
            `การหลีกเลี่ยงการตั้งคำถามหรือแลกเปลี่ยนความคิดเห็นเมื่อพบข้อสงสัย`
          ],
          explanation: (tp) => `การประยุกต์ใช้ที่มีประสิทธิภาพคือการเชื่อมโยงทฤษฎีสู่การปฏิบัติจริงอย่างมีเหตุผลและวัดผลได้`
        },
        {
          stem: (tp) => `ข้อใดเป็นข้อควรระวังที่สำคัญในการศึกษาและวิเคราะห์ข้อมูลเกี่ยวกับ "${tp}"?`,
          correct: (tp) => `ควรตรวจสอบความถูกต้องของแหล่งข้อมูลและวิเคราะห์ความสัมพันธ์ของตัวแปรอย่างรอบคอบ`,
          distractors: (tp) => [
            `ไม่ควรตั้งสมมติฐานหรือคำถามใดๆ ก่อนการวิเคราะห์ข้อมูล`,
            `ควรเลือกใช้เฉพาะข้อมูลที่มีปริมาณน้อยที่สุดเสมอ`,
            `ไม่จำเป็นต้องคำนึงถึงบริบทหรือเงื่อนไขของปัญหา`
          ],
          explanation: (tp) => `ความถูกต้องของข้อมูลและเงื่อนไขแวดล้อมเป็นปัจจัยหลักที่ส่งผลต่อความแม่นยำในการวิเคราะห์`
        }
      ];

      const results = [];
      const offset = (questionIndexHint + existingQuestions.length + Math.floor(Math.random() * 6)) % blueprintTemplates.length;

      for (let i = 0; i < count; i++) {
        const tpl = blueprintTemplates[(offset + i) % blueprintTemplates.length];
        const correctText = tpl.correct(cleanTopic);
        const distractors = tpl.distractors(cleanTopic);

        // Place correct answer at a balanced position (0..3)
        const targetAnswerIdx = (questionIndexHint + i + Math.floor(Math.random() * 4)) % 4;
        const options = [...distractors];
        options.splice(targetAnswerIdx, 0, correctText);

        results.push({
          id: 'q_' + Date.now() + '_' + (questionIndexHint + i) + '_' + Math.random().toString(36).slice(2, 5),
          text: tpl.stem(cleanTopic),
          options,
          answerIndex: targetAnswerIdx,
          score: pts,
          explanation: tpl.explanation(cleanTopic),
          _generatedByModel: 'EduPortal Smart Exam AI (ฟรี)'
        });
      }

      return results;
    }

              >

              <p className="text-sm font-bold text-slate-700">ยังไม่มีแบบทดสอบในวิชานี้</p>

          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {visibleExams.map(exam => {
                let questions = [];
                try { questions = JSON.parse(exam.QuestionsJSON || '[]'); } catch { questions = []; }
                const examAttempts = attempts.filter(a => a.ExamID === exam.ExamID);
                const myAttempt = currentUser.role === 'student' 
                  ? examAttempts.find(a => isSameStudentId(a.StudentID, currentUser.user.StudentID))
                  : null;

                const totalPoints = questions.reduce((acc, q) => acc + (parseInt(q.score) || 5), 0);

                return (
                  <div key={exam.ExamID} className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between space-y-4">
                    <div className="space-y-2">
                      <div className="flex items-start justify-between gap-2">
                        <h3 className="font-bold text-base text-slate-900">{exam.Title}</h3>
                        {currentUser.role !== 'student' && (
                          <div className="flex items-center gap-1 shrink-0">
                            <button
                              onClick={() => handleOpenEdit(exam)}
                              className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-500 hover:text-indigo-600"
                              title="แก้ไขชุดข้อสอบ / ให้ AI ช่วยเพิ่มข้อสอบ"
                            >
                              <Icon name="Edit" size={16} />
                            </button>
                            <button
                              onClick={() => handleDelete(exam.ExamID)}
                              className="p-1.5 hover:bg-rose-50 rounded-lg text-slate-400 hover:text-rose-600"
                              title="ลบข้อสอบ"
                            >
                              <Icon name="Trash2" size={16} />
                            </button>
                          </div>
                        )}
                      </div>

                      <p className="text-xs text-slate-600 line-clamp-2 leading-relaxed">
                        {exam.Description}
                      </p>

                      <div className="flex flex-wrap items-center gap-2 pt-1 text-xs text-slate-500">
                        <span className="flex items-center gap-1 bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-200">
                          <Icon name="Clock" size={13} />
                          <span>เวลา {exam.TimeLimitMin || '15'} นาที</span>
                        </span>
                        <span className="flex items-center gap-1 bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-200">
                          <Icon name="FileText" size={13} />
                          <span>{questions.length} ข้อ ({totalPoints} คะแนน)</span>
                        </span>
                      </div>
                    </div>

                    <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                      {currentUser.role === 'student' ? (
                        myAttempt ? (
                          <div className="flex items-center justify-between w-full">
                            <span className="text-xs text-slate-500">สอบเมื่อ: {myAttempt.SubmittedAt}</span>
                            <span className="px-3 py-1 bg-emerald-100 text-emerald-800 font-black text-xs rounded-full">
                              ได้ {myAttempt.Score} / {myAttempt.TotalScore} คะแนน
                            </span>
                          </div>
                        ) : (
                          <button
                            onClick={() => {
                              Swal.fire({
                                title: `เริ่มทำแบบทดสอบ?`,
                                html: `<p class="text-sm text-slate-600">ข้อสอบมี <b>${questions.length}</b> ข้อ ให้เวลา <b>${exam.TimeLimitMin}</b> นาที<br>เมื่อกดเริ่มเวลาจะนับถอยหลังทันที และส่งกระดาษคำตอบอัตโนมัติเมื่อหมดเวลา</p>`,
                                icon: 'info',
                                showCancelButton: true,
                                confirmButtonText: 'เริ่มทำข้อสอบทันที',
                                cancelButtonText: 'ยังไม่พร้อม',
                                confirmButtonColor: '#4f46e5'
                              }).then((res) => {
                                if (res.isConfirmed) onStartExam(exam);
                              });
                            }}
                            className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center justify-center gap-1.5"
                          >
                            <Icon name="Play" size={15} />
                            <span>เริ่มทำข้อสอบตอนนี้</span>
                          </button>
                        )
                      ) : (
                        <div className="flex items-center justify-between w-full">
                          <span className="text-xs text-slate-500">ผู้เข้าสอบแล้ว: {examAttempts.length} คน</span>
                          <button
                            onClick={() => setViewingAttemptsExam(exam)}
                            className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
                          >
                            <Icon name="BarChart2" size={14} />
                            <span>ดูผลคะแนนสอบ</span>
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Modal Add/Edit Exam (Teacher) with Per-Question & Bulk AI Question Generator */}
          {showModal && editingExam && (
            <ExamBuilderModal
              course={course}
              editingExam={editingExam}
              setEditingExam={setEditingExam}
              onClose={() => setShowModal(false)}
              onSave={handleSaveExamSubmit}
            />
          )}

          {/* Modal View Exam Attempts (Teacher) */}
          {viewingAttemptsExam && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 space-y-4 max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-slate-900">ผลการสอบ: {viewingAttemptsExam.Title}</h3>
                    <p className="text-xs text-slate-500">รายชื่อนักเรียนและคะแนนที่บันทึกไว้</p>
                  </div>
                  <button onClick={() => setViewingAttemptsExam(null)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="X" size={18} />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto custom-scroll space-y-2">
                  {attempts.filter(a => a.ExamID === viewingAttemptsExam.ExamID).length === 0 ? (
                    <div className="py-12 text-center text-slate-400 text-sm">ยังไม่มีนักเรียนเข้าสอบในชุดนี้</div>
                  ) : (
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                        <tr>
                          <th className="py-2.5 px-3">รหัสนักเรียน</th>
                          <th className="py-2.5 px-3">ชื่อ-นามสกุล</th>
                          <th className="py-2.5 px-3 text-center">คะแนนที่ได้</th>
                          <th className="py-2.5 px-3">เวลาที่ส่ง</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {attempts.filter(a => a.ExamID === viewingAttemptsExam.ExamID).map(att => (
                          <tr key={att.AttemptID} className="hover:bg-slate-50">
                            <td className="py-2.5 px-3 font-mono font-medium">{att.StudentID}</td>
                            <td className="py-2.5 px-3 font-bold text-slate-800">{att.StudentName}</td>
                            <td className="py-2.5 px-3 text-center font-black text-indigo-600">
                              {att.Score} / {att.TotalScore}
                            </td>
                            <td className="py-2.5 px-3 text-slate-400 text-[11px]">{att.SubmittedAt}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Modal Helper for Building Exam Questions (Includes Per-Question AI Assist & Bulk AI Exam Generator)
    function ExamBuilderModal({ course, editingExam, setEditingExam, onClose, onSave }) {
      const initialConfig = useMemo(() => getAiConfig(), []);
      const [selectedModelId, setSelectedModelId] = useState(initialConfig.selectedModelId || 'builtin-smart-thai');

      // Bulk AI Generator State
      const [bulkTopic, setBulkTopic] = useState('');
      const [bulkCount, setBulkCount] = useState('3');
      const [bulkDifficulty, setBulkDifficulty] = useState('medium');
      const [bulkMode, setBulkMode] = useState('append'); // 'append' | 'replace'
      const [isBulkGenerating, setIsBulkGenerating] = useState(false);

      // Per-Question AI Generator State (indexed by qIdx)
      const [perQuestionTopics, setPerQuestionTopics] = useState({});
      const [perQuestionDiffs, setPerQuestionDiffs] = useState({});
      const [generatingQIdx, setGeneratingQIdx] = useState(null);

      const currentModel = useMemo(
        () => AI_MODELS_CATALOG.find(m => m.id === selectedModelId) || AI_MODELS_CATALOG[0],
        [selectedModelId]
      );
      const freeModels = useMemo(() => AI_MODELS_CATALOG.filter(m => m.tier === 'free'), []);
      const paidModels = useMemo(() => AI_MODELS_CATALOG.filter(m => m.tier === 'paid'), []);

      const questions = useMemo(() => {
        try { return JSON.parse(editingExam.QuestionsJSON || '[]'); } catch { return []; }
      }, [editingExam.QuestionsJSON]);

      const updateQuestions = (newQ) => {
        setEditingExam(prev => ({ ...prev, QuestionsJSON: JSON.stringify(newQ) }));
      };

      const handleSelectModel = (nextId) => {
        setSelectedModelId(nextId);
        saveAiConfig({ selectedModelId: nextId });
      };

      const handleAddQuestion = () => {
        const newQ = [
          ...questions,
          {
            id: 'q_' + Date.now(),
            text: 'คำถามข้อที่ ' + (questions.length + 1),
            options: ['ตัวเลือก ก', 'ตัวเลือก ข', 'ตัวเลือก ค', 'ตัวเลือก ง'],
            answerIndex: 0,
            score: 5
          }
        ];
        updateQuestions(newQ);
      };

      // Add a new question generated directly by AI with 1 click
      const handleAddAiNewQuestion = async () => {
        setGeneratingQIdx('new');
        try {
          const targetTopic = bulkTopic.trim() || editingExam.Title.trim() || course?.Name || 'ความรู้ประจำรายวิชา';
          const generated = await generateAiExamQuestionsEngine({
            course,
            examTitle: editingExam.Title,
            topic: targetTopic,
            questionCount: 1,
            difficulty: bulkDifficulty,
            scorePerQuestion: 5,
            questionIndexHint: questions.length,
            existingQuestions: questions,
            modelId: selectedModelId
          });
          if (generated && generated[0]) {
            const cleanQ = { ...generated[0] };
            delete cleanQ._generatedByModel;
            updateQuestions([...questions, cleanQ]);
          }
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'ไม่สามารถสร้างข้อสอบด้วย AI ได้', text: err.message || 'กรุณาตรวจสอบการตั้งค่า AI' });
        } finally {
          setGeneratingQIdx(null);
        }
      };

      // Generate or rewrite a SPECIFIC question (ข้อที่ qIdx + 1) using AI!
      const handleGenerateSingleQuestion = async (qIdx) => {
        const currentQ = questions[qIdx];
        const customHint = (perQuestionTopics[qIdx] || '').trim();
        const existingTextHint = currentQ?.text && !/^คำถามข้อที่\s*\d+$/i.test(currentQ.text.trim()) ? currentQ.text.trim() : '';
        const targetTopic = customHint || existingTextHint || bulkTopic.trim() || editingExam.Title.trim() || course?.Name || 'ความรู้ประจำวิชา';
        const diff = perQuestionDiffs[qIdx] || 'medium';

        setGeneratingQIdx(qIdx);
        try {
          const otherQuestions = questions.filter((_, idx) => idx !== qIdx);
          const generated = await generateAiExamQuestionsEngine({
            course,
            examTitle: editingExam.Title,
            topic: targetTopic,
            questionCount: 1,
            difficulty: diff,
            scorePerQuestion: currentQ?.score || 5,
            questionIndexHint: qIdx,
            existingQuestions: otherQuestions,
            modelId: selectedModelId
          });

          if (generated && generated[0]) {
            const next = [...questions];
            next[qIdx] = {
              ...next[qIdx],
              text: generated[0].text,
              options: generated[0].options,
              answerIndex: generated[0].answerIndex,
              explanation: generated[0].explanation || ''
            };
            updateQuestions(next);
          }
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'สร้างโจทย์ข้อนี้ไม่สำเร็จ', text: err.message || 'กรุณาตรวจสอบการตั้งค่า AI' });
        } finally {
          setGeneratingQIdx(null);
        }
      };

      // Bulk generate multiple questions at once
      const handleBulkAiGenerate = async () => {
        const targetTopic = bulkTopic.trim() || editingExam.Title.trim() || course?.Name || 'ความรู้พื้นฐานประจำรายวิชา';
        if (!editingExam.Title.trim()) {
          setEditingExam(prev => ({ ...prev, Title: `แบบทดสอบเรื่อง ${targetTopic}` }));
        }
        setIsBulkGenerating(true);
        try {
          const generated = await generateAiExamQuestionsEngine({
            course,
            examTitle: editingExam.Title || targetTopic,
            topic: targetTopic,
            questionCount: parseInt(bulkCount) || 3,
            difficulty: bulkDifficulty,
            scorePerQuestion: 5,
            questionIndexHint: bulkMode === 'replace' ? 0 : questions.length,
            existingQuestions: bulkMode === 'replace' ? [] : questions,
            modelId: selectedModelId
          });
          if (generated && generated.length > 0) {
            const cleanedList = generated.map(item => {
              const copy = { ...item };
              delete copy._generatedByModel;
              return copy;
            });
            const isDefaultPlaceholderOnly = questions.length === 1 && /^คำถามข้อที่\s*1$/i.test((questions[0]?.text || '').trim());
            const finalQuestions = (bulkMode === 'replace' || isDefaultPlaceholderOnly)
              ? cleanedList
              : [...questions, ...cleanedList];
            updateQuestions(finalQuestions);

            Swal.fire({
              icon: 'success',
              title: `✨ AI สร้างข้อสอบ ${cleanedList.length} ข้อสำเร็จ!`,
              text: `สร้างโจทย์ ตัวเลือก 4 ข้อ และกำหนดเฉลยให้อัตโนมัติเรียบร้อยแล้ว`,
              timer: 1600,
              showConfirmButton: false
            });
          }
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'ไม่สามารถสร้างชุดข้อสอบได้', text: err.message || 'กรุณาตรวจสอบการตั้งค่า AI' });
        } finally {
          setIsBulkGenerating(false);
        }
      };

      const handleRemoveQuestion = (idx) => {
        const next = questions.filter((_, i) => i !== idx);
        updateQuestions(next);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-sm">
          <div className="bg-white rounded-t-3xl sm:rounded-3xl max-w-4xl w-full p-5 sm:p-6 shadow-2xl border-t sm:border border-slate-100 space-y-4 max-h-[94vh] flex flex-col bottom-sheet pb-safe">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 text-white flex items-center justify-center shadow-sm">
                  <Icon name="Sparkles" size={18} />
                </div>
                <div>
                  <h3 className="text-base sm:text-lg font-extrabold text-slate-900">สร้าง/แก้ไขชุดแบบทดสอบออนไลน์ (พร้อม AI ผู้ช่วยออกข้อสอบ)</h3>
                  <p className="text-[11px] text-slate-500">ใช้ AI ช่วยคิดโจทย์เจาะจงทีละข้อ หรือสร้างรวดเดียวหลายข้อพร้อมตัวเลือกและเฉลย</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">
                <Icon name="X" size={20} />
              </button>
            </div>

            <form onSubmit={onSave} className="flex-1 overflow-y-auto custom-scroll space-y-4 pr-1">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="sm:col-span-2">
                  <label className="block text-xs font-bold text-slate-700 mb-1">ชื่อชุดแบบทดสอบ *</label>
                  <input
                    type="text"
                    required
                    value={editingExam.Title}
                    onChange={(e) => setEditingExam({ ...editingExam, Title: e.target.value })}
                    placeholder="เช่น แบบทดสอบเก็บคะแนนบทที่ 1"
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">เวลาทำข้อสอบ (นาที) *</label>
                  <input
                    type="number"
                    required
                    min="1"
                    value={editingExam.TimeLimitMin}
                    onChange={(e) => setEditingExam({ ...editingExam, TimeLimitMin: e.target.value })}
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 font-mono"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">คำชี้แจง</label>
                <textarea
                  rows={2}
                  value={editingExam.Description}
                  onChange={(e) => setEditingExam({ ...editingExam, Description: e.target.value })}
                  placeholder="คำชี้แจงในการทำแบบทดสอบ..."
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500"
                ></textarea>
              </div>

              {/* AI Bulk & Model Control Panel */}
              <div className="bg-gradient-to-r from-violet-50 via-indigo-50 to-fuchsia-50 rounded-2xl p-4 border border-indigo-200/80 space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <Icon name="Sparkles" size={16} className="text-indigo-600" />
                    <span className="text-xs sm:text-sm font-extrabold text-indigo-950">
                      AI ช่วยสร้างข้อสอบอัตโนมัติ (สร้างรายข้อด้านล่าง หรือสร้างเพิ่มเป็นชุดที่นี่)
                    </span>
                  </div>

                  {/* Model Switcher Pill */}
                  <div className="flex items-center gap-1.5">
                    <span className="text-[11px] font-bold text-slate-600">โมเดล AI:</span>
                    <select
                      value={selectedModelId}
                      onChange={(e) => handleSelectModel(e.target.value)}
                      className="px-2.5 py-1 bg-white border border-indigo-200 rounded-xl text-[11px] font-extrabold text-indigo-900 focus:outline-none"
                    >
                      <optgroup label="🟢 โมเดลฟรี (Free)">
                        {freeModels.map(m => (
                          <option key={m.id} value={m.id}>[ฟรี] {m.name}</option>
                        ))}
                      </optgroup>
                      <optgroup label="🟣 มีค่าใช้จ่าย (Paid)">
                        {paidModels.map(m => (
                          <option key={m.id} value={m.id}>[โปร] {m.name}</option>
                        ))}
                      </optgroup>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                  <div className="sm:col-span-5">
                    <input
                      type="text"
                      value={bulkTopic}
                      onChange={(e) => setBulkTopic(e.target.value)}
                      placeholder={`ระบุหัวข้อที่จะออกสอบ (เช่น ${editingExam.Title || course?.Name || 'บทที่ 1'})`}
                      className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div className="sm:col-span-2">
                    <select
                      value={bulkCount}
                      onChange={(e) => setBulkCount(e.target.value)}
                      className="w-full px-2.5 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold"
                    >
                      <option value="1">สร้าง 1 ข้อ</option>
                      <option value="3">สร้าง 3 ข้อ</option>
                      <option value="5">สร้าง 5 ข้อ</option>
                      <option value="10">สร้าง 10 ข้อ</option>
                    </select>
                  </div>
                  <div className="sm:col-span-2">
                    <select
                      value={bulkDifficulty}
                      onChange={(e) => setBulkDifficulty(e.target.value)}
                      className="w-full px-2.5 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold"
                    >
                      <option value="easy">ระดับง่าย</option>
                      <option value="medium">ระดับปานกลาง</option>
                      <option value="hard">ระดับยาก/วิเคราะห์</option>
                      <option value="mixed">คละความยาก</option>
                    </select>
                  </div>
                  <div className="sm:col-span-3 flex items-center gap-1.5">
                    <button
                      type="button"
                      disabled={isBulkGenerating}
                      onClick={handleBulkAiGenerate}
                      className="w-full py-2 px-3 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 disabled:opacity-50 text-white font-extrabold text-xs rounded-xl shadow-sm flex items-center justify-center gap-1.5 transition active:scale-95"
                    >
                      <Icon name="Sparkles" size={14} className={isBulkGenerating ? "animate-spin" : ""} />
                      <span>{isBulkGenerating ? 'กำลังออกข้อสอบ...' : `✨ AI สร้าง +${bulkCount} ข้อ`}</span>
                    </button>
                  </div>
                </div>
              </div>

              {/* Dynamic Questions Builder (with Per-Question AI Assist on EVERY item!) */}
              <div className="space-y-4 pt-1">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <h4 className="text-xs font-black uppercase text-indigo-600 tracking-wider">
                    รายการข้อสอบทั้งหมด ({questions.length} ข้อ • รวม {questions.reduce((s, q) => s + (parseInt(q.score) || 5), 0)} คะแนน)
                  </h4>
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      disabled={generatingQIdx === 'new'}
                      onClick={handleAddAiNewQuestion}
                      className="px-3 py-1.5 bg-violet-100 text-violet-800 hover:bg-violet-200 rounded-xl text-xs font-extrabold flex items-center gap-1 transition active:scale-95"

    // --- Interactive Online Exam Taking Room ---
    function ExamTakingView({ exam, student, onComplete, onCancel }) {
      const questions = useMemo(() => {
        try { return JSON.parse(exam.QuestionsJSON || '[]'); } catch { return []; }
      }, [exam.QuestionsJSON]);

      const [answers, setAnswers] = useState({});
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState(() => (parseInt(exam.TimeLimitMin) || 15) * 60);
      const timerRef = useRef(null);

      // Auto Countdown Timer
      useEffect(() => {
        timerRef.current = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              handleAutoSubmit();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timerRef.current);
      }, []);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const calculateScore = () => {
        let score = 0;
        let total = 0;
        questions.forEach((q, idx) => {
          const qScore = parseInt(q.score) || 5;
          total += qScore;
          if (answers[idx] === q.answerIndex) {
            score += qScore;
          }
        });
        return { score, total };
      };

      const handleAutoSubmit = () => {
        Swal.fire({
          icon: 'warning',
          title: 'หมดเวลาทำข้อสอบ!',
          text: 'ระบบกำลังส่งกระดาษคำตอบของคุณโดยอัตโนมัติ...',
          timer: 2000,
          showConfirmButton: false
        }).then(() => {
          finishExam();
        });
      };

      const finishExam = () => {
        const { score, total } = calculateScore();
        const totalDuration = (parseInt(exam.TimeLimitMin) || 15) * 60;
        const timeSpent = totalDuration - timeLeft;

        onComplete({
          AttemptID: 'ATT_' + Date.now().toString().slice(-6),
          ExamID: exam.ExamID,
          CourseID: exam.CourseID,
          StudentID: student.StudentID,
          StudentName: student.Name,
          Score: String(score),
          TotalScore: String(total),
          SubmittedAt: new Date().toLocaleString('th-TH'),
          TimeSpentSec: String(timeSpent)
        });
      };

      const handleManualSubmit = () => {
        const answeredCount = Object.keys(answers).length;
        const totalCount = questions.length;

        Swal.fire({
          title: 'ยืนยันส่งกระดาษคำตอบ?',
          html: `คุณตอบไปแล้ว <b>${answeredCount}</b> จาก ${totalCount} ข้อ<br>ต้องการส่งคำตอบทันทีหรือไม่?`,
          icon: 'question',
          showCancelButton: true,
          confirmButtonText: 'ส่งกระดาษคำตอบ',
          cancelButtonText: 'กลับไปทำต่อ',
          confirmButtonColor: '#4f46e5'
        }).then((res) => {
          if (res.isConfirmed) {
            clearInterval(timerRef.current);
            finishExam();
          }
        });
      };

      const currentQ = questions[currentQuestionIndex];

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col font-sans">
          {/* Exam Header */}
          <header className="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-sm px-3.5 sm:px-6 py-3">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-2">
              <div className="min-w-0">
                <h1 className="text-sm sm:text-base font-extrabold text-slate-900 truncate">{exam.Title}</h1>
                <p className="text-[11px] sm:text-xs text-slate-500 truncate">นักเรียน: {student.Name} ({student.StudentID})</p>
              </div>

              {/* Timer Display */}
              <div className={`flex items-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-1.5 sm:py-2 rounded-2xl font-mono text-sm sm:text-base font-extrabold shadow-sm shrink-0 ${
                timeLeft < 120 ? 'bg-rose-50 text-rose-600 border border-rose-200 animate-pulse' : 'bg-indigo-50 text-indigo-700 border border-indigo-100'
              }`}>
                <Icon name="Clock" size={16} />
                <span>{formatTime(timeLeft)}</span>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-3.5 sm:p-6 pb-28 sm:pb-8 space-y-4 sm:space-y-6">
            {/* Question Quick Jump Pager (Horizontally scrollable on mobile) */}
            <div className="bg-white rounded-2xl p-3 sm:p-4 border border-slate-200 flex items-center gap-3 overflow-x-auto custom-scroll">
              <span className="text-xs font-bold text-slate-600 shrink-0">ข้อที่:</span>
              <div className="flex items-center gap-1.5 sm:flex-wrap">
                {questions.map((_, idx) => (
                  <button
                    key={idx}
                    onClick={() => setCurrentQuestionIndex(idx)}
                    className={`w-9 h-9 sm:w-8 sm:h-8 rounded-xl font-extrabold text-xs shrink-0 transition active:scale-95 ${
                      currentQuestionIndex === idx
                        ? 'bg-indigo-600 text-white shadow-md'
                        : answers[idx] !== undefined
                          ? 'bg-emerald-100 text-emerald-800 border border-emerald-200'
                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {idx + 1}
                  </button>
                ))}
              </div>
            </div>

            {/* Active Question Card */}
            {currentQ && (
              <div className="bg-white rounded-3xl p-5 sm:p-8 border border-slate-200 shadow-sm space-y-5 sm:space-y-6">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3.5">
                  <span className="font-extrabold text-xs sm:text-sm text-indigo-600">
                    คำถามข้อที่ {currentQuestionIndex + 1} จาก {questions.length}

                  {currentQ.options.map((opt, optIdx) => {
                    const isSelected = answers[currentQuestionIndex] === optIdx;

                      <div

                          isSelected

                        }`}
                      >
                        <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 ${
                          isSelected ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300'

                        <span className="text-sm sm:text-base leading-snug">{opt}</span>
                      </div>
                    );
                  })}
                </div>

                {/* Desktop Navigation Footer */}
                <div className="hidden sm:flex items-center justify-between pt-6 border-t border-slate-100">
                  <button
                    disabled={currentQuestionIndex === 0}
                    onClick={() => setCurrentQuestionIndex(prev => prev - 1)}

                  >
                    <Icon name="ChevronLeft" size={16} />
                    <span>ข้อก่อนหน้า</span>
                  </button>

                  {currentQuestionIndex < questions.length - 1 ? (
                    <button
                      onClick={() => setCurrentQuestionIndex(prev => prev + 1)}
                      className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold flex items-center gap-1 shadow"
                    >
                      <span>ข้อถัดไป</span>
                      <Icon name="ChevronRight" size={16} />
                    </button>
                  ) : (
                    <button
                      onClick={handleManualSubmit}
                      className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg shadow-emerald-600/20"
                    >
                      <Icon name="CheckCircle" size={16} />
                      <span>ส่งกระดาษคำตอบ</span>
                    </button>
                  )}

              </div>
            )}
          </main>

          {/* Mobile Fixed Bottom Exam Controls */}
          <div className="sm:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 p-3 pb-safe flex items-center justify-between gap-2.5 shadow-[0_-4px_20px_rgba(15,23,42,0.06)]">
            <button
              disabled={currentQuestionIndex === 0}
              onClick={() => setCurrentQuestionIndex(prev => prev - 1)}

            >
              <Icon name="ChevronLeft" size={16} />
              <span>ก่อนหน้า</span>
            </button>

            <button
              onClick={handleManualSubmit}
              className="px-4 py-3 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-2xl text-xs font-extrabold active:scale-95"
            >
              ส่งคำตอบ ({Object.keys(answers).length}/{questions.length})
            </button>

            {currentQuestionIndex < questions.length - 1 ? (
              <button
                onClick={() => setCurrentQuestionIndex(prev => prev + 1)}

    function EvaluationsView({ course, evaluations, currentUser, gasUrl, callGasApi, onSaveEvaluation }) {
      const isStudent = currentUser.role === 'student';

      const myEval = useMemo(() => {
        if (!isStudent) return null;
        return evaluations.find(ev => isSameStudentId(ev.StudentID, currentUser.user.StudentID) && ev.CourseID === course.CourseID);
      }, [evaluations, currentUser, isStudent, course.CourseID]);

      // Evaluation Form State
      const [ratings, setRatings] = useState({
        Clarity: 5,
        Engagement: 5,
        Materials: 5,
        Assessment: 5,
        Counseling: 5
      });
      const [comment, setComment] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const criteria = [
        { key: 'Clarity', title: '1. ความชัดเจนในการอธิบายเนื้อหา', desc: 'ครูอธิบายเนื้อหาได้เข้าใจง่าย มีตัวอย่างประกอบชัดเจน' },
        { key: 'Engagement', title: '2. กิจกรรมการเรียนรู้และการมีส่วนร่วม', desc: 'เปิดโอกาสให้นักเรียนซักถาม ร่วมแสดงความคิดเห็น และทำกิจกรรม' },
        { key: 'Materials', title: '3. คุณภาพของสื่อการสอนและใบงาน', desc: 'สไลด์ วิดีโอ และเอกสารประกอบมีความน่าสนใจ สอดคล้องกับบทเรียน' },
        { key: 'Assessment', title: '4. ความเป็นธรรมในการวัดและประเมินผล', desc: 'เกณฑ์การให้คะแนนชัดเจน มีความเหมาะสมและเป็นธรรม' },
        { key: 'Counseling', title: '5. การให้คำปรึกษาและคำแนะนำ', desc: 'ครูให้คำแนะนำและช่วยเหลือเมื่อนักเรียนมีข้อสงสัย' }
      ];

      const handleRatingChange = (key, val) => {
        setRatings(prev => ({ ...prev, [key]: val }));
      };

      const handleSubmitEvaluation = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        const values = Object.values(ratings);
        const overall = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(1);

        const evalRecord = {
          ID: 'EVAL_' + Date.now().toString().slice(-6),
          CourseID: course.CourseID,
          TeacherID: course.TeacherID,
          TeacherName: course.TeacherName,
          StudentID: currentUser.user.StudentID, // Recorded to prevent duplicate, kept hidden from teacher summary
          Clarity: String(ratings.Clarity),
          Engagement: String(ratings.Engagement),
          Materials: String(ratings.Materials),
          Assessment: String(ratings.Assessment),
          Counseling: String(ratings.Counseling),
          OverallScore: String(overall),
          Comment: comment.trim(),
          SubmittedAt: new Date().toLocaleString('th-TH')
        };

        if (gasUrl) {
          await callGasApi('submitEvaluation', { evaluation: evalRecord });
        }

        onSaveEvaluation(evalRecord);
        setIsSubmitting(false);

        Swal.fire({
          icon: 'success',
          title: 'ส่งแบบประเมินเรียบร้อย!',
          text: 'ข้อมูลการประเมินถูกส่งโดยไม่ระบุตัวตน ขอบคุณสำหรับความคิดเห็นครับ',
          confirmButtonColor: '#4f46e5'
        });
      };

      // Statistics calculations for Teacher / Admin dashboard
      const stats = useMemo(() => {
        if (evaluations.length === 0) return null;

        const count = evaluations.length;
        const sum = (key) => evaluations.reduce((acc, curr) => acc + (parseFloat(curr[key]) || 0), 0);

        return {
          count,
          avgOverall: (evaluations.reduce((acc, curr) => acc + (parseFloat(curr.OverallScore) || 0), 0) / count).toFixed(2),
          avgClarity: (sum('Clarity') / count).toFixed(2),
          avgEngagement: (sum('Engagement') / count).toFixed(2),
          avgMaterials: (sum('Materials') / count).toFixed(2),

      return (

                <p className="text-xs text-slate-500 max-w-md mx-auto">
                  บันทึกข้อมูลเมื่อ {myEval.SubmittedAt} (ระบบบันทึกแบบไม่ระบุตัวตนเพื่อความโปร่งใส)

            ) : (
              <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
                <div className="p-4 bg-indigo-50/70 border border-indigo-200 rounded-2xl flex items-start gap-3">
                  <Icon name="Shield" size={20} className="text-indigo-600 shrink-0 mt-0.5" />
                  <div className="text-xs text-indigo-900 leading-relaxed">
                    <b>การประเมินแบบไม่ระบุตัวตน (Anonymous):</b> ระบบจะใช้รหัสนักเรียนเพื่อป้องกันการประเมินซ้ำเท่านั้น โดยชื่อและรหัสนักเรียนของคุณจะไม่ปรากฏในรายงานสรุปของคุณครู
                  </div>

                <form onSubmit={handleSubmitEvaluation} className="space-y-6">
                  <div className="space-y-4">
                    {criteria.map((item) => (
                      <div key={item.key} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                          <div>
                            <h4 className="font-bold text-sm text-slate-800">{item.title}</h4>
                            <p className="text-xs text-slate-500">{item.desc}</p>
                          </div>

                          {/* 5-Star Rating Buttons */}
                          <div className="flex items-center gap-1">
                            {[1, 2, 3, 4, 5].map((star) => (

                            ))}
                            <span className="text-xs font-bold text-slate-700 ml-2 min-w-[20px]">
                              {ratings[item.key]} ดาว
                            </span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">
                      ข้อเสนอแนะเพิ่มเติมเพื่อการพัฒนาการสอน (Optional)
                    </label>
                    <textarea
                      rows={3}
                      value={comment}
                      onChange={(e) => setComment(e.target.value)}
                      placeholder="เช่น ครูสอนเข้าใจง่าย อยากให้มีกิจกรรมกลุ่มเพิ่มขึ้น..."
                      className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs focus:outline-none focus:border-indigo-500"
                    ></textarea>
                  </div>

                  <div className="flex justify-end pt-2">
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-xs font-bold rounded-xl shadow-md transition"
                    >
                      {isSubmitting ? 'กำลังส่งข้อมูล...' : 'ส่งแบบประเมิน'}
                    </button>
                  </div>
                </form>
              </div>
            )
          ) : (
            /* Teacher / Admin Analytics Dashboard */
            <div className="space-y-6">
              {!stats ? (
                <div className="bg-white rounded-3xl p-12 text-center border border-slate-200 text-slate-400 text-sm">
                  ยังไม่มีนักเรียนส่งแบบประเมินในรายวิชานี้
                </div>
              ) : (
                <div className="space-y-6">
                  {/* Summary Metric Cards */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-slate-500 block">ผู้ร่วมประเมินทั้งหมด</span>
                      <span className="text-3xl font-black text-indigo-600 mt-2 block">{stats.count} คน</span>
                    </div>

                    <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-slate-500 block">คะแนนเฉลี่ยรวม</span>
                      <div className="flex items-baseline gap-2 mt-2">
                        <span className="text-3xl font-black text-amber-500">{stats.avgOverall}</span>
                        <span className="text-xs text-slate-400">/ 5.0</span>
                      </div>
                    </div>

                    <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-slate-500 block">การอธิบายเนื้อหา</span>
                      <span className="text-3xl font-black text-slate-800 mt-2 block">{stats.avgClarity}</span>
                    </div>

                    <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-slate-500 block">การมีส่วนร่วมในชั้นเรียน</span>
                      <span className="text-3xl font-black text-slate-800 mt-2 block">{stats.avgEngagement}</span>
                    </div>
                  </div>

                  {/* Rating Breakdown Bars */}
                  <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                    <h3 className="font-bold text-sm text-slate-900">สรุปคะแนนประเมินแยกตามเกณฑ์ 5 ด้าน</h3>
                    <div className="space-y-3">
                      {[
                        { label: 'ความชัดเจนในการสอน (Clarity)', score: stats.avgClarity },
                        { label: 'การมีส่วนร่วมและกิจกรรม (Engagement)', score: stats.avgEngagement },
                        { label: 'คุณภาพสื่อการสอนและใบงาน (Materials)', score: stats.avgMaterials },
                        { label: 'ความเป็นธรรมในการวัดผล (Assessment)', score: stats.avgAssessment },
                        { label: 'การให้คำปรึกษาแก่นักเรียน (Counseling)', score: stats.avgCounseling }
                      ].map((bar, bIdx) => (
                        <div key={bIdx} className="space-y-1">
                          <div className="flex justify-between text-xs">
                            <span className="font-medium text-slate-700">{bar.label}</span>
                            <span className="font-bold text-indigo-600 font-mono">{bar.score} / 5.0</span>
                          </div>
                          <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                            <div
                              className="bg-indigo-600 h-full rounded-full transition-all duration-500"
                              style={{ width: `${(parseFloat(bar.score) / 5) * 100}%` }}
                            ></div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Anonymous Student Comments */}
                  <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-3">
                    <h3 className="font-bold text-sm text-slate-900">ข้อเสนอแนะและคำติชมจากนักเรียน (ไม่ระบุตัวตน)</h3>
                    <div className="divide-y divide-slate-100">
                      {evaluations.filter(e => e.Comment && e.Comment.trim() !== '').map((item, idx) => (
                        <div key={idx} className="py-3 space-y-1">
                          <p className="text-xs text-slate-700 leading-relaxed italic">
                            "{item.Comment}"
                          </p>
                          <div className="flex items-center gap-2 text-[11px] text-slate-400">
                            <span>ส่งเมื่อ: {item.SubmittedAt}</span>
                            <span>•</span>

    // --- Admin Module: Students Management & High-Performance CSV Chunking ---
    function StudentsManagementView({ students, courses, gasUrl, callGasApi, onSaveStudent, onDeleteStudent, onBatchImportSuccess }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [showModal, setShowModal] = useState(false);
      const [showImportModal, setShowImportModal] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);

      // CSV Bulk Chunking State
      const [csvFile, setCsvFile] = useState(null);
      const [parsedRecords, setParsedRecords] = useState([]);
      const [isImporting, setIsImporting] = useState(false);
      const [importProgress, setImportProgress] = useState(0);
      const [importStatusText, setImportStatusText] = useState('');

      const filteredStudents = useMemo(() => {
        const q = searchQuery.toLowerCase().trim();
        if (!q) return students;
        return students.filter(s =>
          (s.StudentID || '').toLowerCase().includes(q) ||
          (s.Name || '').toLowerCase().includes(q) ||
          (s.Grade || '').toLowerCase().includes(q)
        );
      }, [students, searchQuery]);

      const handleOpenAdd = () => {
        setEditingStudent({
          ID: 'S' + Date.now().toString().slice(-4),
          StudentID: '',
          PIN: '1234',
          Name: '',
          Email: '', // Optional as per spec
          Grade: 'ม.3/1',
          AllowedCourses: courses.map(c => c.CourseID).join(','),
          CreatedAt: new Date().toISOString().split('T')[0]
        });
        setShowModal(true);
      };

      const handleOpenEdit = (st) => {
        setEditingStudent({ ...st });
        setShowModal(true);
      };

      const handleDelete = (studentId) => {
        Swal.fire({
          title: 'ลบข้อมูลนักเรียน?',
          text: `ต้องการลบข้อมูลนักเรียนรหัส ${studentId} หรือไม่?`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'ยืนยันลบ',
          cancelButtonText: 'ยกเลิก',
          confirmButtonColor: '#ef4444'
        }).then((res) => {
          if (res.isConfirmed) {
            onDeleteStudent(studentId);
            Swal.fire({ icon: 'success', title: 'ลบข้อมูลเรียบร้อย', timer: 1200, showConfirmButton: false });
          }
        });
      };

      const handleSaveStudentSubmit = (e) => {
        e.preventDefault();
        onSaveStudent(editingStudent);
        setShowModal(false);
        Swal.fire({ icon: 'success', title: 'บันทึกข้อมูลนักเรียนสำเร็จ', timer: 1200, showConfirmButton: false });
      };

      // Handle CSV File Reading with UTF-8
      const handleCsvFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setCsvFile(file);

        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = evt.target.result;
          const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
          if (lines.length <= 1) {
            Swal.fire({ icon: 'error', title: 'ไฟล์ว่างเปล่า', text: 'ไม่พบแถวข้อมูลในไฟล์ CSV' });
            return;
          }

          const headers = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, ''));
          const records = [];

          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
            if (cols.length >= 2) {
              const rec = {
                ID: 'S_' + Date.now() + '_' + i,
                StudentID: cols[0] || '',
                PIN: cols[1] || '1234',
                Name: cols[2] || '',
                Email: cols[3] || '',
                Grade: cols[4] || 'ม.3/1',
                AllowedCourses: cols[5] || courses.map(c => c.CourseID).join(','),
                CreatedAt: new Date().toISOString().split('T')[0]
              };
              if (rec.StudentID) records.push(rec);
            }
          }

          setParsedRecords(records);
        };
        reader.readAsText(file, 'UTF-8');
      };

      // High Performance Chunking Import Routine
      const executeChunkedImport = async () => {
        if (parsedRecords.length === 0) return;

        setIsImporting(true);
        setImportProgress(0);
        const CHUNK_SIZE = 50; // 50 students per chunk to avoid GAS execution timeouts
        const totalChunks = Math.ceil(parsedRecords.length / CHUNK_SIZE);
        let importedCount = 0;

        for (let i = 0; i < totalChunks; i++) {
          const chunk = parsedRecords.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
          setImportStatusText(`กำลังส่งข้อมูลชุดที่ ${i + 1} จาก ${totalChunks} (${chunk.length} คน)...`);

          if (gasUrl) {
            await callGasApi('batchSave', { sheetName: 'Students', records: chunk });
          }

          importedCount += chunk.length;
          const pct = Math.round((importedCount / parsedRecords.length) * 100);
          setImportProgress(pct);
        }

        onBatchImportSuccess(parsedRecords);
        setIsImporting(false);
        setShowImportModal(false);
        setParsedRecords([]);
        setCsvFile(null);

        Swal.fire({
          icon: 'success',
          title: 'นำเข้าข้อมูลนักเรียนสำเร็จ!',
          text: `นำเข้าข้อมูลนักเรียนทั้งหมด ${importedCount} คน เรียบร้อยแล้ว`,
          confirmButtonColor: '#4f46e5'
        });
      };

      return (
        <div className="space-y-4 sm:space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">จัดการข้อมูลนักเรียน (Students)</h1>
              <p className="text-xs text-slate-500">จัดการรายชื่อ กำหนด PIN และการเข้าถึงรายวิชา (AllowedCourses)</p>
            </div>

            <div className="grid grid-cols-2 sm:flex items-center gap-2">
              <button
                onClick={() => setShowImportModal(true)}
                className="px-3.5 py-2.5 sm:px-4 sm:py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-1.5 active:scale-95"
              >
                <Icon name="FileSpreadsheet" size={16} />
                <span>นำเข้า CSV</span>
              </button>

              <button
                onClick={handleOpenAdd}
                className="px-3.5 py-2.5 sm:px-4 sm:py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-1.5 active:scale-95"
              >
                <Icon name="Plus" size={16} />
                <span>เพิ่มนักเรียน</span>
              </button>
            </div>
          </div>

          {/* Search bar */}
          <div className="bg-white rounded-2xl p-3 border border-slate-200 flex items-center gap-3 shadow-sm">
            <Icon name="Search" size={18} className="text-slate-400 shrink-0" />
            <input
              type="text"
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              placeholder="ค้นหาด้วยรหัสนักเรียน, ชื่อ-นามสกุล, หรือชั้นเรียน..."
              className="w-full text-xs bg-transparent focus:outline-none text-slate-700"
            />
          </div>

          {/* Mobile Card List (Visible only on phones) */}
          <div className="md:hidden space-y-3">
            {filteredStudents.length === 0 ? (
              <div className="bg-white rounded-3xl p-8 text-center text-slate-400 text-xs border border-slate-200">
                ไม่พบข้อมูลนักเรียนที่ตรงกับเงื่อนไข
              </div>
            ) : (
              filteredStudents.map(student => (
                <div key={student.StudentID} className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2.5">
                  <div className="flex items-start justify-between gap-2">
                    <div>
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="font-mono font-extrabold text-xs text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-lg border border-indigo-100">
                          #{student.StudentID}
                        </span>
                        <span className="px-2 py-0.5 bg-slate-100 rounded-lg text-[11px] text-slate-700 font-bold">
                          {student.Grade}
                        </span>
                        <span className="text-[11px] font-mono text-slate-400">
                          PIN: {student.PIN || '1234'}
                        </span>
                      </div>
                      <h3 className="font-extrabold text-sm text-slate-900 mt-1.5">{student.Name}</h3>
                    </div>

                    <div className="flex items-center gap-1 shrink-0">
                      <button
                        onClick={() => handleOpenEdit(student)}
                        className="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-600 active:scale-95"
                        title="แก้ไข"
                      >
                        <Icon name="Edit" size={15} />
                      </button>
                      <button
                        onClick={() => handleDelete(student.StudentID)}
                        className="p-2 bg-rose-50 hover:bg-rose-100 rounded-xl text-rose-600 active:scale-95"
                        title="ลบ"
                      >
                        <Icon name="Trash2" size={15} />
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500">
                    <span className="font-mono truncate max-w-[180px]">วิชา: {student.AllowedCourses || 'ทุกวิชา (*)'}</span>
                    {student.Email && <span className="font-mono text-slate-400">{student.Email}</span>}
                  </div>
                </div>
              ))
            )}
          </div>

          {/* Desktop Students Data Table */}
          <div className="hidden md:block bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
            <div className="overflow-x-auto custom-scroll">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                  <tr>
                    <th className="py-3 px-4">รหัสนักเรียน</th>
                    <th className="py-3 px-4">ชื่อ - นามสกุล</th>
                    <th className="py-3 px-4">รหัส PIN</th>
                    <th className="py-3 px-4">ระดับชั้น</th>
                    <th className="py-3 px-4">อีเมล (Optional)</th>
                    <th className="py-3 px-4">สิทธิ์รายวิชา (AllowedCourses)</th>
                    <th className="py-3 px-4 text-center">จัดการ</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filteredStudents.length === 0 ? (
                    <tr>
                      <td colSpan={7} className="py-12 text-center text-slate-400">
                        ไม่พบข้อมูลนักเรียนที่ตรงกับเงื่อนไข
                      </td>
                    </tr>
                  ) : (
                    filteredStudents.map(student => (
                      <tr key={student.StudentID} className="hover:bg-slate-50">
                        <td className="py-3 px-4 font-mono font-bold text-indigo-700">{student.StudentID}</td>
                        <td className="py-3 px-4 font-bold text-slate-800">{student.Name}</td>
                        <td className="py-3 px-4 font-mono text-slate-500 tracking-wider">{student.PIN || '1234'}</td>
                        <td className="py-3 px-4">
                          <span className="px-2 py-0.5 bg-slate-100 rounded text-slate-700 font-medium">{student.Grade}</span>
                        </td>
                        <td className="py-3 px-4 text-slate-500 font-mono text-[11px]">{student.Email || '-'}</td>
                        <td className="py-3 px-4 text-[11px] font-mono text-slate-600 max-w-xs truncate" title={student.AllowedCourses}>
                          {student.AllowedCourses || 'ทุกวิชา (*)'}
                        </td>
                        <td className="py-3 px-4 text-center">
                          <div className="flex items-center justify-center gap-1">
                            <button
                              onClick={() => handleOpenEdit(student)}
                              className="p-1 hover:bg-slate-100 rounded text-slate-500 hover:text-slate-700"
                              title="แก้ไข"
                            >
                              <Icon name="Edit" size={15} />
                            </button>
                            <button
                              onClick={() => handleDelete(student.StudentID)}
                              className="p-1 hover:bg-rose-50 rounded text-slate-400 hover:text-rose-600"
                              title="ลบ"
                            >
                              <Icon name="Trash2" size={15} />
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* Modal Add/Edit Student */}
          {showModal && editingStudent && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/50 backdrop-blur-sm">
              <div className="bg-white rounded-t-3xl sm:rounded-3xl max-w-lg w-full p-6 shadow-2xl border-t sm:border border-slate-100 space-y-4 bottom-sheet pb-safe">

          try { return JSON.parse(item.SettingValueJSON); } catch { return null; }
        }
        return { enabled: true, title: 'ไม่มีประกาศในขณะนี้', content: '', badge: 'ประกาศทั่วไป' };

              <h3 className="font-bold text-sm text-slate-900">แก้ไขเนื้อหาประกาศ (Admin Settings)</h3>

              <form onSubmit={handleSave} className="space-y-4">
                <div className="flex items-center gap-2">
                  <input
                    type="checkbox"
                    id="ann_enabled"
                    checked={formData.enabled}
                    onChange={(e) => setFormData({ ...formData, enabled: e.target.checked })}
                    className="w-4 h-4 text-indigo-600 rounded"
                  />
                  <label htmlFor="ann_enabled" className="text-xs font-bold text-slate-700 cursor-pointer">
                    เปิดแสดงผลป๊อปอัปอัตโนมัติเมื่อผู้ใช้เข้าสู่ระบบ
                  </label>
                </div>

                <div className="grid grid-cols-3 gap-3">
                  <div className="col-span-2">
                    <label className="block text-xs font-bold text-slate-700 mb-1">หัวข้อประกาศ</label>
                    <input
                      type="text"
                      required
                      value={formData.title}
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">ป้ายกำกับ (Badge)</label>
                    <input
                      type="text"
                      value={formData.badge}
                      onChange={(e) => setFormData({ ...formData, badge: e.target.value })}
                      placeholder="เช่น ประกาศด่วน"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">เนื้อหาประกาศ</label>
                  <textarea
                    rows={4}
                    required
                    value={formData.content}
                    onChange={(e) => setFormData({ ...formData, content: e.target.value })}
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                  ></textarea>
                </div>

                <div className="flex justify-end pt-2">
                  <button
                    type="submit"
                    className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition"
                  >
                    บันทึกการตั้งค่าประกาศ
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // --- Admin Module: Settings & Backend Control Center ---
    function SettingsView({ settings, gasUrl, setGasUrl, onPing, onSetup, onPull, onPush, onSaveSetting }) {
      const [urlInput, setUrlInput] = useState(gasUrl);
      const [folderIdInput, setFolderIdInput] = useState(() => {
        const item = settings.find(s => s.SettingKey === 'DriveFolderID');
        if (item && item.SettingValueJSON) {
          try { return JSON.parse(item.SettingValueJSON); } catch { return item.SettingValueJSON; }
        }
        return '';
      });

      const [adminPassInput, setAdminPassInput] = useState(() => {
        const item = settings.find(s => s.SettingKey === 'AdminPassword');
        if (item && item.SettingValueJSON) {
          try { return JSON.parse(item.SettingValueJSON); } catch { return item.SettingValueJSON; }
        }
        return 'admin1234';
      });

      const handleSaveGeneral = (e) => {
        e.preventDefault();
        setGasUrl(urlInput.trim());

        onSaveSetting({
          SettingKey: 'DriveFolderID',
          SettingValueJSON: JSON.stringify(folderIdInput.trim()),
          UpdatedAt: new Date().toISOString()
        });

        onSaveSetting({
          SettingKey: 'AdminPassword',
          SettingValueJSON: JSON.stringify(adminPassInput.trim()),
          UpdatedAt: new Date().toISOString()
        });

        Swal.fire({
          icon: 'success',
          title: 'บันทึกการตั้งค่าระบบเรียบร้อย',
          timer: 1500,
          showConfirmButton: false
        });
      };

      return (
        <div className="space-y-6 max-w-4xl">
          <div>
            <h1 className="text-2xl font-black text-slate-900 tracking-tight">ตั้งค่าระบบและศูนย์ควบคุม (System Settings)</h1>
            <p className="text-xs text-slate-500">การเชื่อมต่อ Google Apps Script, โฟลเดอร์ Google Drive และความปลอดภัย</p>
          </div>

          {/* Database Control Buttons Panel */}
          <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
            <h3 className="font-bold text-sm text-slate-900 flex items-center gap-2">
              <Icon name="Database" size={18} className="text-indigo-600" />
              <span>ศูนย์ควบคุมฐานข้อมูล Google Sheets (Database Control Panel)</span>
            </h3>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              <button
                type="button"
                onClick={onPing}
                className="p-4 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-2xl border border-indigo-200 text-left transition space-y-1"
              >
                <div className="flex items-center gap-2 font-bold text-xs">
                  <Icon name="RefreshCw" size={16} />
                  <span>[1] ทดสอบเชื่อมต่อ (Ping)</span>
                </div>
                <p className="text-[11px] text-indigo-900/70">ตรวจสอบความพร้อมของ GAS Web App</p>
              </button>

              <button
                type="button"
                onClick={onSetup}
                className="p-4 bg-amber-50 hover:bg-amber-100 text-amber-800 rounded-2xl border border-amber-200 text-left transition space-y-1"
              >
                <div className="flex items-center gap-2 font-bold text-xs">
                  <Icon name="Database" size={16} />
                  <span>[2] สร้าง 10 Sheet (Setup)</span>
                </div>
                <p className="text-[11px] text-amber-900/70">สร้างและจัดหัวตารางให้อัตโนมัติ</p>
              </button>

              <button
                type="button"
                onClick={onPull}
                className="p-4 bg-sky-50 hover:bg-sky-100 text-sky-700 rounded-2xl border border-sky-200 text-left transition space-y-1"
              >
                <div className="flex items-center gap-2 font-bold text-xs">
                  <Icon name="DownloadCloud" size={16} />
                  <span>[3] ดึงข้อมูลสู่ระบบ (Pull)</span>
                </div>
                <p className="text-[11px] text-sky-900/70">อ่านข้อมูลล่าสุดจาก Google Sheets</p>
              </button>

              <button
                type="button"
                onClick={onPush}
                className="p-4 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-2xl border border-emerald-200 text-left transition space-y-1"
              >
                <div className="flex items-center gap-2 font-bold text-xs">
                  <Icon name="UploadCloud" size={16} />
                  <span>[4] ส่งข้อมูลขึ้น Sheets (Push)</span>
                </div>
                <p className="text-[11px] text-emerald-900/70">บันทึกข้อมูลในเครื่องขึ้นชีตทั้งหมด</p>
              </button>
            </div>
          </div>

          {/* Connection Parameters Form */}
          <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
            <h3 className="font-bold text-sm text-slate-900 flex items-center gap-2">
              <Icon name="Link" size={18} className="text-indigo-600" />
              <span>พารามิเตอร์การเชื่อมต่อ (Backend Credentials)</span>
            </h3>

            <form onSubmit={handleSaveGeneral} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  Google Apps Script Web App URL
                </label>
                <input
                  type="url"
                  value={urlInput}
                  onChange={(e) => setUrlInput(e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono focus:outline-none focus:border-indigo-500"
                />
                <p className="text-[11px] text-slate-400 mt-1">
                  * ต้อง Deploy สคริปต์ Code.gs แบบ "Web App" โดยตั้งค่า Execute as: Me และ Who has access: Anyone
                </p>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  Google Drive Folder ID (สำหรับจัดเก็บไฟล์การบ้านนักเรียน)
                </label>
                <input
                  type="text"
                  value={folderIdInput}
                  onChange={(e) => setFolderIdInput(e.target.value)}
                  placeholder="เช่น 1A2b3C4d5E... (หากเว้นว่าง ระบบจะสร้างโฟลเดอร์ EduPortal_Submissions ให้อัตโนมัติ)"
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  รหัสผ่านผู้ดูแลระบบ (Admin Password)
                </label>
                <input
                  type="text"
                  required
                  value={adminPassInput}
                  onChange={(e) => setAdminPassInput(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="flex justify-end pt-2">
                <button
                  type="submit"
                  className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition"
                >
                  บันทึกการตั้งค่าระบบ
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- Mount React Application ---
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<EduPortalApp />);
  </script>
</body>
</html>
